name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked --all-features

  install-smoke:
    name: cargo install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --path . --root "$RUNNER_TEMP/install" --locked
      - run: "$RUNNER_TEMP/install/bin/specdev-analyzer --version"

  composition-gates:
    # Per-stack composition gates. Each bootstraps a project, inlines the
    # units of one stack, emits the manifest, and RESOLVES it — then asserts
    # on the resolved lockfile that co-inlined units agree on the crates they
    # share, and that the join product they exist to produce is present.
    #
    # Ignored in the normal `test` job because they reach crates.io, git
    # remotes, and pub.dev; the rest of the suite is hermetic and stays so.
    # Split into its own job so a registry outage reads as "composition gates
    # unavailable", not "the analyzer is broken".
    name: composition gates (network)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v4
      - name: Checkout specdev plugin tree
        uses: actions/checkout@v4
        with:
          # TODO: replace `<owner>/specdev` once the plugin tree is published
          # to GitHub — same placeholder as the agnosticism-lint job below.
          # The gates test the units that actually ship, so they run against
          # the live tree rather than a fixture mirror.
          repository: <owner>/specdev
          path: specdev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          # The dart stack resolves with `flutter pub get`; without the SDK
          # that one test skips rather than fails.
          channel: stable
      - name: Run composition gates
        run: bash .github/scripts/composition-gates.sh

  agnosticism-lint:
    # D51 self-enforcement (doc 21 §9). Scans `src/` for hardcoded
    # profile/block/bridge name string literals using the live names
    # listed under the sibling `specdev` plugin tree.
    #
    # Phase 16 §8.1 step 11 (b): non-blocking. Runs informationally; the
    # job is permitted to fail without failing the workflow. Phase (c)
    # blocking upgrade lands as a follow-up commit once one CI run has
    # confirmed clean (`continue-on-error: true` removed).
    name: D51 agnosticism lint (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v4
      - name: Checkout specdev plugin tree
        uses: actions/checkout@v4
        with:
          # TODO: replace `<owner>/specdev` once the plugin tree is
          # published to GitHub. The local workspace currently has no
          # `origin` remote configured (verified 2026-05-07). The lint
          # runs locally + via this CI job once the plugin is published.
          repository: <owner>/specdev
          path: specdev
      - name: Run agnosticism lint
        run: bash .github/scripts/agnosticism-lint.sh ./specdev
