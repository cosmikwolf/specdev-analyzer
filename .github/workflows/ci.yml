name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# ============================================================================
# CHECKOUT LAYOUT — read this before adding a job.
#
# Every `src/lang/*.rs` embeds the plugin's tree-sitter queries with
# `include_str!("../../../specdev/languages/<lang>/*.scm")`. That path resolves
# from `src/lang/` up three levels — to the PARENT of this repository's root —
# so the plugin tree must be a SIBLING of the analyzer checkout. Anything that
# compiles fails without it:
#
#   error: couldn't read `src/lang/../../../specdev/languages/c/audit.scm`
#
# `actions/checkout` refuses a `path` outside `$GITHUB_WORKSPACE` ("Repository
# path ... is not under ..."), so a repository checked out at the workspace
# root can never be given a sibling. Every job therefore checks this repository
# out into `specdev-analyzer/` and the plugin into `specdev/` — both under the
# workspace, which makes them siblings of each other. Cargo steps carry
# `working-directory: specdev-analyzer`, and `Swatinem/rust-cache` is told
# where the workspace is.
#
# Jobs that compile need the plugin checkout: clippy, test, install-smoke.
# `fmt` does not compile, so it omits it.
#
# The plugin repository is public, so the default GITHUB_TOKEN checks it out;
# no extra secret is needed. A fork checks out the plugin from its own owner
# (`github.repository_owner`), so a forked pair stays a pair.
# ============================================================================

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: specdev-analyzer
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: specdev-analyzer

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v7
        with:
          path: specdev-analyzer
      - name: Checkout specdev plugin tree (sibling — see CHECKOUT LAYOUT)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/specdev
          path: specdev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: specdev-analyzer
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: specdev-analyzer

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v7
        with:
          path: specdev-analyzer
      - name: Checkout specdev plugin tree (sibling — see CHECKOUT LAYOUT)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/specdev
          path: specdev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: specdev-analyzer
      # The package.json emitter's live tests (`tests/manifest_package_json.rs`)
      # check `pnpm --version` at runtime and SKIP when it is absent, so
      # without these two steps this job goes green having resolved no
      # manifest at all. Versions match `languages/typescript/build.md`'s
      # `packageManager` / `engines.node` pins, which are what the emitted
      # manifests declare.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
      - run: cargo build --locked
        working-directory: specdev-analyzer
      - run: cargo test --locked --all-features --no-fail-fast
        working-directory: specdev-analyzer

  msrv:
    # The declared floor must be a tested claim, not a comment. `rust-version`
    # sat at 1.75 for eleven minor versions while the dependency graph moved
    # to 1.86 (clap_builder needs edition 2024; eleven icu_* packages require
    # 1.86) — nothing ever built against the declared value, so nothing ever
    # said it was wrong. Pin this job to the exact version in Cargo.toml and
    # bump both together.
    name: build on the declared MSRV (1.86.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v7
        with:
          path: specdev-analyzer
      - name: Checkout specdev plugin tree (sibling — see CHECKOUT LAYOUT)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/specdev
          path: specdev
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: specdev-analyzer
      - run: cargo check --locked --all-targets
        working-directory: specdev-analyzer

  install-smoke:
    name: cargo install smoke test (NO sibling — models the real user)
    runs-on: ubuntu-latest
    steps:
      # DELIBERATELY the only checkout in this job. This job used to check the
      # plugin out as a sibling and run `cargo install --path .`, which models a
      # DEVELOPER, not the user it is named for. With the sibling present it
      # stayed green while `cargo install --git <url>` — the command all three
      # of the plugin's install sites tell a co-worker to run — failed for every
      # user, because `src/lang/*.rs` reached across the repository boundary
      # with `include_str!("../../../specdev/...")`.
      #
      # Do NOT add a plugin checkout here. Its absence is the assertion.
      - name: Checkout analyzer (and nothing else)
        uses: actions/checkout@v7
        with:
          path: specdev-analyzer
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: specdev-analyzer
      - name: Confirm no sibling plugin tree exists
        run: |
          if [ -d "$GITHUB_WORKSPACE/specdev" ]; then
            echo "::error::a specdev/ sibling exists; this job asserts the crate builds WITHOUT one"
            exit 1
          fi
          echo "no sibling present — a standalone build is what follows"
      - run: cargo install --path . --root "$RUNNER_TEMP/install" --locked
        working-directory: specdev-analyzer
      - run: "$RUNNER_TEMP/install/bin/specdev-analyzer --version"

  agnosticism-lint:
    # D51 self-enforcement (doc 21 §9). Scans `src/` for hardcoded
    # profile/block/bridge name string literals using the live names
    # listed under the sibling `specdev` plugin tree.
    #
    # Phase 16 §8.1 step 11 (b): non-blocking. Runs informationally; the
    # job is permitted to fail without failing the workflow. Phase (c)
    # blocking upgrade lands as a follow-up commit once one CI run has
    # confirmed clean (`continue-on-error: true` removed).
    #
    # This job greps; it does not compile. It still uses the shared layout so
    # the plugin sits where the script's own default lookup expects it.
    name: D51 agnosticism lint (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v7
        with:
          path: specdev-analyzer
      - name: Checkout specdev plugin tree (sibling — see CHECKOUT LAYOUT)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/specdev
          path: specdev
      - name: Run agnosticism lint
        run: bash .github/scripts/agnosticism-lint.sh ../specdev
        working-directory: specdev-analyzer
