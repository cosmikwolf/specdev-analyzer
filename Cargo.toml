[package]
name = "specdev-analyzer"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Domain-agnostic analyzer for TOML specs. Parse, validate, extract, and audit spec-driven projects."
license = "MIT"
repository = "https://github.com/tenkai/specdev-analyzer"
readme = "README.md"

[[bin]]
name = "specdev-analyzer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"

[dev-dependencies]
insta = "1"
