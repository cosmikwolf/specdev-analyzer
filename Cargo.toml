[package]
name = "specdev-analyzer"
version = "0.2.0"
edition = "2021"
# Set by the DEPENDENCY graph, not by this crate's own source: clap_builder
# needs edition 2024, and eleven icu_* packages require 1.86. Measured with
# `cargo check --lib`: 1.81 and 1.85 fail, 1.86 and 1.88 pass. The `msrv` CI
# job builds on exactly this toolchain so the number stays a tested claim —
# the previous value, 1.75, had gone eleven minor versions stale unnoticed
# because nothing ever built against it.
rust-version = "1.86"
description = "Domain-agnostic analyzer for TOML specs. Parse, validate, extract, and audit spec-driven projects."
license = "MIT"
# `repository` is deliberately unset: both repositories are private and the
# org differs per install, so any single URL here is wrong for someone.
# See README "Install" for how to resolve the org.
readme = "README.md"

[lib]
name = "specdev_analyzer"
path = "src/lib.rs"

[[bin]]
name = "specdev-analyzer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `serde_yaml` was marked deprecated by its author. `serde_yaml_ng` is a
# maintained drop-in fork; we alias it as `serde_yaml` so source code stays
# identical.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
toml = "1"
# `toml_edit` powers Phase 14 `items apply` mutation. Round-trips
# user-authored module specs (preserving comments, key order, and
# inline-table whitespace) instead of re-emitting from scratch.
toml_edit = "0.22"
jsonschema = { version = "0.46", default-features = false }
owo-colors = "4"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-dart = "0.2"
tree-sitter-typescript = "0.23"
glob = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
insta = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
