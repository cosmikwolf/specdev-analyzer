[package]
name = "specdev-analyzer"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Domain-agnostic analyzer for TOML specs. Parse, validate, extract, and audit spec-driven projects."
license = "MIT"
repository = "https://github.com/tenkai/specdev-analyzer"
readme = "README.md"

[[bin]]
name = "specdev-analyzer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
jsonschema = { version = "0.17", default-features = false }
owo-colors = "4"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"

[dev-dependencies]
insta = "1"
