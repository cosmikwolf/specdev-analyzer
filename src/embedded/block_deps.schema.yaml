$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schema/meta/v1/block_deps.schema.yaml"
title: "block deps manifest (v1)"
description: |
  Validates `blocks/<block-name>/codegen/<language>/deps.yaml`. Optional
  per (block, language) pair; when present, the analyzer drains dep
  entries into the project's manifest at render time — `crates[]` into
  Cargo.toml, `pub[]` into pubspec.yaml (each key models its
  ecosystem's closed set of dep shapes; a deps.yaml carries whichever
  keys its language directory implies).
  `recommended_external_deps[]` is a non-injecting suggestion list
  surfaced by /spec-design; it never injects, which keeps the spec the
  source of truth.
  Inlined alongside the block's README; participates in the block's
  per-unit content_hash.

type: object
additionalProperties: false
properties:
  crates:
    description: |
      Crate dependencies the block contributes to Cargo.toml when inlined.
    type: array
    items:
      $ref: "#/$defs/CrateEntry"

  pub:
    description: |
      pub package dependencies the block contributes to pubspec.yaml when
      inlined. Contributions are runtime `dependencies:` — dev-dep
      routing (`test_only`) is a spec-side external_deps concern,
      mirroring the crates[] rule.
    type: array
    items:
      $ref: "#/$defs/PubEntry"

  npm:
    description: |
      npm package dependencies the block contributes to package.json when
      inlined. Contributions are runtime `dependencies` — dev-dep routing
      (`test_only`) is a spec-side external_deps concern, mirroring the
      crates[] and pub[] rule.
    type: array
    items:
      $ref: "#/$defs/NpmEntry"

  recommended_external_deps:
    description: |
      Non-injecting suggestions surfaced by /spec-design. NOT auto-merged
      into the project's Cargo.toml — the user explicitly authors crates
      they accept under `[external_deps]`.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [crate, purpose]
      properties:
        crate:
          description: Crate name (matches a crates.io / git crate name).
          type: string
          minLength: 1
        purpose:
          description: |
            Required when an entry is listed. Short prose (≤80 chars)
            explaining why /spec-design should suggest this crate. Empty
            string is rejected at load time — purpose-less suggestions
            don't help authors decide whether to accept them.
          type: string
          minLength: 1
          maxLength: 80

$defs:
  CrateEntry:
    description: |
      One Cargo dep entry. Mirrors the existing CrateReference shape
      (src/embedded/crate_reference.schema.yaml) so the deps.yaml shape
      and module-level external_deps[] share vocabulary.
    type: object
    additionalProperties: false
    required: [name, version]
    properties:
      name:
        type: string
        minLength: 1
      version:
        description: |
          cargo-style version requirement (e.g. "^0.4", "~1.2", "0.0").
        type: string
        minLength: 1
      features:
        type: array
        items:
          type: string
      default_features:
        type: boolean
      optional:
        type: boolean
      source:
        description: |
          Closed-set tagged union mirroring CrateReference:
            { path: "..." }                       — path-dep
            { git: "...", rev/tag/branch: "..." } — git-dep
            "workspace"                           — workspace inheritance
            "crates-io"                           — explicit default registry
        oneOf:
          - type: object
            additionalProperties: false
            required: [path]
            properties:
              path:
                type: string
                minLength: 1
          - type: object
            additionalProperties: false
            required: [git]
            properties:
              git:
                type: string
                minLength: 1
              rev:
                type: string
              tag:
                type: string
              branch:
                type: string
          - type: string
            enum: [workspace, crates-io]

  PubEntry:
    description: |
      One pubspec dep entry. Mirrors the PubReference shape the pubspec
      emitter parses from spec-side external_deps, minus `test_only`
      (block/bridge contributions are runtime deps). Closed set of
      source shapes — exactly one of the source keys may appear:
        (none)                                  — hosted, default registry
        hosted: "https://..." [+ version]       — hosted, custom URL
        git: { url, ref?, path?, tag_pattern? } — git dep
        path: "..."                             — path dep
        sdk: "flutter"                          — SDK-vendored (e.g. flutter)
      `version` is required for registry-hosted deps (default or custom
      URL) and optional elsewhere — pub accepts a constraint alongside
      any source and checks it against the resolved package (with
      `git.tag_pattern` it is what the solver resolves against). A
      stated version is always emitted.
    type: object
    additionalProperties: false
    required: [package]
    properties:
      package:
        description: pub package name (lower_snake_case identifier).
        type: string
        minLength: 1
      version:
        description: |
          pub semver constraint (e.g. "^1.2.0", ">=2.0.0 <3.0.0", "any").
        type: string
        minLength: 1
      hosted:
        description: Custom package-repository URL (modern short form).
        type: string
        minLength: 1
      git:
        type: object
        additionalProperties: false
        required: [url]
        properties:
          url:
            type: string
            minLength: 1
          ref:
            type: string
          path:
            description: Sub-path inside the git repo holding the package.
            type: string
          tag_pattern:
            description: |
              Version-resolution pattern over git tags (e.g.
              "v{{version}}"): pub queries matching tags and feeds their
              versions to the solver against the entry's `version`
              constraint. Requires the project's SDK constraint to be
              ^3.9.0 or higher.
            type: string
      path:
        description: Local path dep, relative to the pubspec's directory.
        type: string
        minLength: 1
      sdk:
        description: SDK source — `flutter` is the only commonly-used value.
        type: string
        minLength: 1
    allOf:
      # At most one source key.
      - not:
          anyOf:
            - required: [hosted, git]
            - required: [hosted, path]
            - required: [hosted, sdk]
            - required: [git, path]
            - required: [git, sdk]
            - required: [path, sdk]
      # Registry-hosted deps (no git/path/sdk key) must carry a version —
      # each branch requires the discriminating key, so absence cannot
      # vacuously satisfy it.
      - anyOf:
          - required: [git]
          - required: [path]
          - required: [sdk]
          - required: [version]

  NpmEntry:
    description: |
      One package.json dep entry. Mirrors the NpmReference shape the
      package.json emitter parses from spec-side external_deps, minus
      `test_only` (block/bridge contributions are runtime deps). A
      package.json dependency value is ONE string, so exactly one shape
      applies:
        version: "^1.2.3"              — registry dep (range emitted verbatim)
        git: { url, ref? }             — `<url>#<ref>`
        path: "../x"                   — `file:../x` (copy + install target deps)
        link: "../x"                   — `link:../x` (symlink, install nothing)
        workspace: "*"                 — `workspace:*`
      `version` is required for a registry dep and FORBIDDEN beside any
      source key (no sibling-version slot, unlike pubspec).
    type: object
    additionalProperties: false
    required: [package]
    properties:
      package:
        description: npm package name, scope included (`@scope/name`).
        type: string
        minLength: 1
      version:
        description: npm range string (e.g. "^1.2.3", ">=1.2.0 <2.0.0").
        type: string
        minLength: 1
      git:
        type: object
        additionalProperties: false
        required: [url]
        properties:
          url:
            type: string
            minLength: 1
          ref:
            type: string
            minLength: 1
      path:
        description: Local directory dep → `file:<path>`.
        type: string
        minLength: 1
      link:
        description: Local directory dep → `link:<path>`.
        type: string
        minLength: 1
      workspace:
        description: Workspace-protocol range → `workspace:<range>`.
        type: string
        minLength: 1
    allOf:
      # At most one source key.
      - not:
          anyOf:
            - required: [git, path]
            - required: [git, link]
            - required: [git, workspace]
            - required: [path, link]
            - required: [path, workspace]
            - required: [link, workspace]
      # A version is forbidden beside any source key.
      - not:
          anyOf:
            - required: [version, git]
            - required: [version, path]
            - required: [version, link]
            - required: [version, workspace]
      # A registry dep (no source key) must carry a version.
      - anyOf:
          - required: [git]
          - required: [path]
          - required: [link]
          - required: [workspace]
          - required: [version]
