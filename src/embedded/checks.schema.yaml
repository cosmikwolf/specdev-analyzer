$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schema/meta/v1/checks.schema.yaml"
title: "Unit rule pack (checks.toml)"
description: |
  The rule pack a block or bridge ships at its root as `checks.toml`, inlined
  to `specs/specdev/checks/{blocks,bridges}/<name>.toml`. `validate` runs its
  graph checks; `check` runs its code checks. A rule's severity comes from
  the project's `domain.toml` `[validation.rules]`, else the pack's `[rules]`,
  else `error`.
type: object
additionalProperties: false
properties:
  rules:
    description: Default severity per rule name.
    type: object
    additionalProperties: { $ref: "#/$defs/Severity" }
  graph_checks:
    description: Graph checks, in the `domain.toml` `[[project.graph_checks]]` shape.
    type: array
    items: { $ref: "#/$defs/GraphCheck" }
  code_checks:
    description: Spec ↔ code checks — a query over the source, compared by key.
    type: array
    items: { $ref: "#/$defs/CodeCheck" }

$defs:
  Severity:
    enum: [error, warning, info]

  NonEmpty:
    type: string
    minLength: 1

  GraphCheck:
    type: object
    additionalProperties: false
    required: [kind, rule]
    # The two pack primitives need their arguments; without them the check
    # would run and find nothing.
    allOf:
      - if: { required: [kind], properties: { kind: { const: unique } } }
        then:
          anyOf:
            - required: [field]
            - required: [fields]
      - if: { required: [kind], properties: { kind: { const: related_attrs_allowed } } }
        then:
          required: [relation_scope, left, right, allowed]
    properties:
      kind: { $ref: "#/$defs/NonEmpty" }
      rule: { $ref: "#/$defs/NonEmpty" }
      scope: { type: string }
      field: { type: string }
      fields:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/NonEmpty" }
      source_field: { type: string }
      target_field: { type: string }
      nodes_field: { type: string }
      edges_from: { type: string }
      edges_to: { type: string }
      entry_field: { type: string }
      module_layer_field: { type: string }
      module_deps_field: { type: string }
      allowed_deps_table: { type: string }
      entity_scope: { type: string }
      relation_scope: { type: string }
      layer_field: { type: string }
      layer_ordering: { type: array, items: { type: string } }
      entity_attr: { type: string }
      entity_attr_value: { type: string }
      expected_count: { type: integer, minimum: 0 }
      target_attr_field: { type: string }
      target_entity_kind: { type: string }
      target_attr: { type: string }
      target_attr_value: { type: string }
      document: { type: string }
      left: { $ref: "#/$defs/Side" }
      right: { $ref: "#/$defs/Side" }
      allowed:
        type: array
        items:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }

  Side:
    description: An attribute on one side of a relation — `relation.<attr>`, `from.<attr>` or `to.<attr>`.
    type: string
    pattern: "^(relation|from|to)\\.[A-Za-z_][A-Za-z0-9_]*$"

  CodeCheck:
    type: object
    additionalProperties: false
    required: [language, query, entity_kind, key_capture]
    dependentRequired:
      attributes: [arg_value_capture]
    # An argument's name comes from a capture or is fixed, never both; a
    # mapping needs one of them.
    not: { required: [arg_key, arg_key_capture] }
    if: { required: [attributes] }
    then:
      anyOf:
        - required: [arg_key]
        - required: [arg_key_capture]
    properties:
      language: { $ref: "#/$defs/NonEmpty" }
      query:
        description: The query file, unit-relative (`languages/<lang>/<file>.scm`).
        type: string
        pattern: "^languages/[^/]+/[^/]+\\.scm$"
      entity_kind:
        description: The spec entity kind the query's matches are compared with (e.g. `<unit>.Task`).
        $ref: "#/$defs/NonEmpty"
      key_capture:
        description: The capture holding the code key — the entity's name without its module prefix.
        $ref: "#/$defs/NonEmpty"
      arg_key_capture: { $ref: "#/$defs/NonEmpty" }
      arg_key:
        description: >
          A fixed argument name, for a value capture with no key node (e.g. the
          `shared` / `local` attribute over a struct is the value of `sharing`).
        $ref: "#/$defs/NonEmpty"
      arg_value_capture: { $ref: "#/$defs/NonEmpty" }
      attributes:
        description: Source argument name → spec attribute name. Only these are compared.
        type: object
        additionalProperties: { $ref: "#/$defs/NonEmpty" }
