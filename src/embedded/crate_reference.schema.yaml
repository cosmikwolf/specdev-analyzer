$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schema/meta/v1/crate_reference.schema.yaml"
title: "CrateReference (v1)"
description: |
  Reusable crate-dependency reference shared across profile-level
  architecture schemas and module-level external_deps. Captures every
  field that maps to a Cargo.toml `[dependencies]` entry. Embedded in
  the analyzer crate so `$ref` to this `$id` resolves universally,
  regardless of project content.

  Phase 6.7 commitment: every Cargo dep is captured in the spec.
  Cargo.toml is OUTPUT — Phase 8's gen consumes these references to
  emit the full Cargo project.

$defs:
  CrateReference:
    type: object
    additionalProperties: false
    required: [crate, version]
    properties:
      crate:
        description: |
          Crate name (lowercase letters, digits, underscore, hyphen;
          must start with a letter). Cargo's published-name rules.
        type: string
        pattern: "^[a-z][a-z0-9_-]*$"
      version:
        description: |
          Cargo-style version requirement. Accepts bare versions
          ("0.3.2"), caret ("^0.3.2"), tilde ("~0.3.2"), wildcards
          ("0.3.*"), comparisons (">=0.3, <0.4"), and "*". Passed
          through to Cargo.toml unchanged; Cargo validates downstream.
        type: string
        minLength: 1
      source:
        description: |
          Where Cargo fetches this crate. Closed-set tagged union;
          unrecognized shapes are rejected at validate time (no silent
          drops). Omit for crates.io (the default).

          Accepted forms:
            * { path = "../sibling-crate" }            — local path-dep
            * { git = "https://...", rev = "..." }     — git-dep with rev/tag/branch
            * "workspace"                              — `<dep>.workspace = true` inheritance
            * "crates-io"                              — explicit default registry (same as omitting `source`)
        oneOf:
          - type: object
            additionalProperties: false
            required: [path]
            properties:
              path:
                description: Relative or absolute filesystem path to the dep crate root.
                type: string
                minLength: 1
          - type: object
            additionalProperties: false
            required: [git]
            properties:
              git:
                description: Git URL (https or ssh).
                type: string
                minLength: 1
              rev:
                description: |
                  Git revision (commit SHA). Cargo allows at most one of
                  `rev`/`tag`/`branch`; v1 schema does not enforce mutual
                  exclusion — Cargo rejects multi-pin downstream.
                type: string
                minLength: 1
              tag:
                description: Git tag.
                type: string
                minLength: 1
              branch:
                description: Git branch.
                type: string
                minLength: 1
          - type: string
            enum: ["workspace", "crates-io"]
      features:
        description: Cargo features to enable for this crate.
        type: array
        items:
          type: string
          minLength: 1
        uniqueItems: true
      default_features:
        description: |
          Set to `false` to disable Cargo's default-features. Defaults
          to Cargo's behavior (true) when absent.
        type: boolean
