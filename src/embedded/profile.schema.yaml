$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schema/meta/v1/profile.schema.yaml"
title: "profile manifest (Phase 16, D52 / doc 21 §3)"
description: |
  Validates `profiles/<name>/profile.yaml`. Authored on the plugin side;
  byte-copied into a project at `specs/specdev/profile.yaml` during
  bootstrap. Drives manifest render dispatch (cargo_toml / pubspec_yaml /
  package_json), skeleton policy,
  context-subcommand extras, and validate-pass surface flags.

  The project's copy IS drift-tracked: bootstrap records every
  profile-scaffolded file's post-substitution hash under `[profile_files]`
  in `lineage.toml`, so `drift` reports this file the way it reports an
  inlined block's (#109). The older claim that a profile "leaves no
  ongoing dependency" was written when profiles shipped only templates and
  prose; a profile now ships the schemas and this manifest, which every
  command reads.

type: object
additionalProperties: false
required: [name, language]
properties:
  contract_version:
    description: |
      The `profile.schema.yaml` contract this manifest is authored
      against. Compared against the analyzer's embedded
      `PROFILE_CONTRACT_VERSION` **before** this schema runs, so a
      plugin newer than the analyzer reports one `MANIFEST-002` naming
      the remedy instead of a pile of `additionalProperties` errors
      naming the user's own file (#117).

      **Optional here, mandatory on the plugin side.** The asymmetry is
      deliberate: this schema also validates project trees bootstrapped
      before the field existed, and those must keep validating, so an
      absent value means contract 1. `plugin-lint` requires the field
      on every `profiles/*/profile.yaml`, because a plugin author who
      omits it at a contract bump reopens #117 for every older binary.
    type: integer
    minimum: 1
  name:
    description: |
      Profile name. MUST match the plugin-tree directory name.
      Lowercase kebab-case identifier.
    type: string
    pattern: "^[a-z][a-z0-9-]*$"

  language:
    description: |
      Target language. References the `languages/<lang>/` tier. Must stay
      in lockstep with the spec schema's `project.language` enum — a
      language is admitted to both enums in the same change, alongside
      its adapter.
    type: string
    enum: [rust, c, cpp, dart, typescript]

  cargo_toml:
    description: |
      Cargo.toml render dispatch. Required for `language: rust`. May be
      omitted for non-Rust profiles (their codegen contract is
      profile-defined elsewhere).
    type: object
    additionalProperties: false
    required: [shape]
    properties:
      shape:
        description: |
          ShapeKind (closed enum): which Cargo.toml shape this profile
          renders. `workspace` is descriptive metadata only; the
          `[workspace]` table presence in spec.toml is the actual
          dispatch signal (doc 21 §3.5).
        type: string
        enum: [library, binary, workspace, plugin]
      default_edition:
        description: |
          Rust edition rendered as `edition = "..."` when the project's
          `[project].edition` is unset. e.g. "2021".
        type: string
      lib:
        description: |
          [lib] section emit policy. Present when shape ∈ {library, plugin}.
        type: object
        additionalProperties: false
        properties:
          crate_type:
            description: |
              CrateType[] (closed enum) — `[lib] crate-type = [...]`.
              Empty/absent = default `[lib]` (rlib).
            type: array
            items:
              type: string
              enum: [lib, rlib, cdylib, staticlib, dylib, proc-macro]
          cdylib_only:
            description: |
              When true, the lib emits only the cdylib crate-type (no rlib).
              Convenience flag for plugins that ship as cdylib + standalone bin.
            type: boolean
      bin:
        description: |
          [[bin]] section emit policy. Present when shape ∈ {binary,
          plugin, library}.

          For `plugin` shape, requires `gate` to fire conditionally.

          For `library` shape, this is what expresses the `src/lib.rs` +
          `src/main.rs` crate — a testable core plus a thin executable
          entry point, in one crate. Absent `bin`, a library-shaped
          profile emits `[lib]` only (the prior behavior, unchanged).
          `name_template` / `path_template` are honored here (the plugin
          shape predates them and uses a fixed standalone pair); a
          `paired_stub` is written on first emit so the crate compiles
          before the entry point is hand-authored.
        type: object
        additionalProperties: false
        required: [name_template, path_template]
        properties:
          name_template:
            description: |
              `[[bin]] name` template. Supports {project_name}.
              Resolves at cargo-toml render time.
            type: string
          path_template:
            description: |
              `[[bin]] path` template. Tokens reserved (no current
              shipped profile uses any token here).
            type: string
          gate:
            description: |
              Optional condition gating the [[bin]] row. Bin only emits
              when the gate is satisfied. v1 supports one kind:
              `architecture_array_contains` checks whether
              architecture.toml's `<table>.<field>` array contains `<value>`.
            type: object
            additionalProperties: false
            required: [kind, table, field, value]
            properties:
              kind:
                type: string
                enum: [architecture_array_contains]
              table:
                type: string
              field:
                type: string
              value:
                type: string
          paired_stub:
            description: |
              F-016: paired source-tree stub written alongside the [[bin]]
              row when the gate fires. The body is read from `template_file`
              (path relative to the profile's plugin-tree dir).
            type: object
            additionalProperties: false
            required: [template_file]
            properties:
              template_file:
                description: |
                  Path under `profiles/<name>/`. e.g.
                  `templates/standalone-stub.rs.template`. Bytes are the
                  stub body; supports {project_name} substitution at
                  cargo-toml render time.
                type: string
                minLength: 1
      features:
        description: |
          [features] synthesis policy — DESCRIPTIVE ONLY. The cargo-toml
          renderer does not read this section: dispatch is by `shape`, and
          each renderer reads architecture.toml's `[[features]]` by fixed
          key when its shape supports them. Keep the values truthful for
          the shape; wiring the renderer to these keys is the v1.1
          fixed-key cleanup.
        type: object
        additionalProperties: false
        properties:
          synthesize_default:
            description: |
              Declares that the renderer for this shape always emits a
              `default = [...]` line in [features]. Not read by the
              renderer — see `features`.
            type: boolean
          drain_from:
            description: |
              Declares the architecture.toml table paths that supply
              [[features]] entries, e.g. ["features"]. Not read by the
              renderer — it reads `features` by fixed key.
            type: array
            items:
              type: string
      architecture_deps:
        description: |
          Crate-ref drains from architecture.toml — DESCRIPTIVE ONLY. The
          renderer does not read this section; it reads the single-crate
          slot tables (`platform`, `runtime`, `logger`) and the open
          `[[external_deps]]` list by fixed key. `typed_slots` names the
          slot tables the binary shape reads; `open_arrays` names the
          open lists. Keep them truthful; wiring the renderer to these
          keys is the v1.1 fixed-key cleanup.
        type: object
        additionalProperties: false
        properties:
          typed_slots:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [table, keys]
              properties:
                table:
                  type: string
                keys:
                  type: array
                  items:
                    type: string
                  minItems: 1
          open_arrays:
            type: array
            items:
              type: string

  pubspec_yaml:
    description: |
      pubspec.yaml render dispatch. Required for `language: dart`. May be
      omitted for non-Dart profiles. Sibling of `cargo_toml` — the
      `manifest` subcommand dispatches on the project language to
      whichever section applies.
    type: object
    additionalProperties: false
    required: [shape]
    properties:
      shape:
        description: |
          PubShapeKind (closed enum): `app` emits `publish_to: none`
          (a Flutter/Dart application, never published); `package` emits
          a publishable library shape; `workspace` is descriptive
          metadata only — the `[workspace]` table presence in spec.toml
          is the actual dispatch signal, mirroring the cargo path.
        type: string
        enum: [app, package, workspace]
      environment:
        description: |
          Default `environment:` constraints emitted when
          architecture.toml's `[environment]` table doesn't override
          them. `sdk` is the Dart SDK constraint (pubspec requires one);
          `flutter` is optional.
        type: object
        additionalProperties: false
        required: [sdk]
        properties:
          sdk:
            type: string
            minLength: 1
          flutter:
            type: string
            minLength: 1

  package_json:
    description: |
      package.json render dispatch. Required for `language: typescript`.
      May be omitted for other languages. Third sibling of `cargo_toml`
      and `pubspec_yaml` — the `manifest` subcommand dispatches on the
      project language to whichever section applies.
    type: object
    additionalProperties: false
    required: [shape]
    properties:
      shape:
        description: |
          PackageJsonShapeKind (closed enum): `app` emits `"private":
          true` (an application, never published); `library` emits a
          publishable package shape; `workspace` renders the pnpm
          workspace root (`package.json` + `pnpm-workspace.yaml`) — the
          `[workspace]` table presence in spec.toml is the actual
          dispatch signal, mirroring the cargo and pub paths.
        type: string
        enum: [app, library, workspace]
      package_manager:
        description: |
          Default `packageManager` field (corepack pin, e.g.
          "pnpm@10.15.0"). architecture.toml's `[environment]
          package_manager` overrides it.
        type: string
        minLength: 1
      engines:
        description: |
          Default `engines` map. architecture.toml's `[environment] node`
          overrides `node` key-by-key.
        type: object
        additionalProperties: false
        properties:
          node:
            type: string
            minLength: 1
      type:
        description: |
          The package.json `type` field. Omitted when absent.
        type: string
        enum: [module, commonjs]
      scripts:
        description: |
          Default `scripts` map. architecture.toml's `[scripts]` table
          overrides key-by-key. Emitted lex-sorted.
        type: object
        additionalProperties:
          type: string
          minLength: 1

  paired_files:
    description: |
      Profile-shipped config files written **once when absent**
      by `manifest --write`, then externally owned — never rewritten,
      never gen-recorded (the category `next build`'s `tsconfig.json`
      rewrite forces). Language-neutral: applied by the shared manifest
      runner for every language, merged with the rust arm's `[[bin]]`
      paired stub. `template_file` is read from the inlined
      `<specdev_root>/templates/` copy; the only token substituted is
      `{project_name}`. `target` is project-root-relative; a target the
      manifest emitter or a `bin.paired_stub` also writes is refused at
      manifest time (two writers, one path).
    type: array
    items:
      type: object
      additionalProperties: false
      required: [template_file, target]
      properties:
        template_file:
          description: |
            Path under `profiles/<name>/`, e.g.
            `templates/tsconfig.json.template`.
          type: string
          minLength: 1
        target:
          description: |
            Project-root-relative path to write, e.g. `tsconfig.json`
            or `app/.gitkeep`. Missing parent directories are created.
          type: string
          minLength: 1

  derived_files:
    description: |
      Rules for files the analyzer derives from a module document and
      writes with `specdev-analyzer derive --write` — one small file per
      matching module (a route shim that re-exports the module body).
      Profile data, never source. Rules are tried **in declared order**
      and the first match wins; a rule whose `when` set is a subset of a
      later rule's `when` set makes that later rule unreachable and the
      whole set is refused. Each derived file is recorded in
      `gen-lineage.toml` with `derived = true` under its module; a row
      no rule produces any more is stale and its file is deleted when
      the bytes still match the record.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [when, path, template]
      properties:
        when:
          description: |
            Attribute equalities on the module document, ANDed. Values
            compare as rendered scalars (`true` matches a TOML `true`).
            An absent attribute matches nothing. `{}` matches every
            module.
          type: object
          additionalProperties:
            type: [string, number, boolean]
        path:
          description: |
            Project-root-relative target, a template over the module
            document (`app${.app_path}/page.tsx`). Duplicate slashes
            collapse after evaluation. Two modules on one target (case
            folded) are refused.
          type: string
          minLength: 1
        template:
          description: |
            Path under `profiles/<name>/` read from the inlined
            `<specdev_root>/templates/` copy. Body tokens are
            `{source_relative}` (the module body's import specifier
            relative to the target's directory, from the language
            adapter) and `{project_name}` — exact-string replacement,
            no other braces are tokens.
          type: string
          minLength: 1
        exclusive:
          description: |
            Group name. Two produced targets in one directory from rules
            of the same group are refused (Next.js: `page.tsx` and
            `route.ts` in one segment conflict at build).
          type: string
          minLength: 1

  gates:
    description: |
      The compile-gate registry: every gate the codegen skill runs after
      emission, as data. Each gate is an opaque `label` (the row key in
      `gen-lineage.toml`, with the module), a `scope`, and `steps` — a
      list of argv lists run in order in the project root, never a shell
      string (one exit code per step; no second grammar for quoting).
      `scope: module` means one execution per run and one recorded row
      per module in the run; `scope: batch` means one row with no
      module (a whole-tree build). A `${root.<table>.<field>}` token in a
      step resolves against `specs/architecture.toml`; a missing field
      is an error, never an empty string. Optional as a key, but not
      optional for codegen: with no module-scope gate declared, `report
      gen-plan` reports `gates_declared: false` and every module
      `verified: false`, and `gen --tail` refuses with the block to
      paste — a gate that skips when its precondition is missing is the
      bug the registry exists to remove. One row per label; a second
      row with the same label is refused at load (two results would
      share one key). Labels are opaque to the analyzer.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [label, scope, steps]
      properties:
        label:
          description: |
            Opaque gate name, e.g. `cargo-check` or `fast`. Becomes the
            `label` of every row the gate writes and the value the
            runner is invoked with; no whitespace.
          type: string
          minLength: 1
          pattern: "^\\S+$"
        scope:
          description: |
            `module` — one row per module in the run; `verified` for a
            module needs a pass row from every module-scope gate.
            `batch` — one whole-tree row, no module; reported per label.
          type: string
          enum: [module, batch]
        steps:
          description: |
            Argv lists, run in order; the first non-zero exit stops the
            gate and fails it. Each list is one process: executable
            first, then its arguments, one string per argument.
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1

  items:
    description: |
      items[] extraction policy (#101(b)). Read by `extract-items`,
      `items diff` and the validate pass's `verified_by` resolution.
    type: object
    additionalProperties: false
    properties:
      visibility_floor:
        description: |
          Lowest source visibility the extractor treats as contract
          surface. An OPAQUE string: the analyzer never interprets it —
          the language adapter compares each captured `<kind>.vis`
          against it (Rust: `pub` ⊃ `pub(crate)` ⊃ `pub(super)`; Dart
          has no modifiers and ignores the key). Absent → the adapter's
          own default (Rust: `pub`). A binary-shaped profile whose
          contract surface is crate-wide declares `pub(crate)`. Does not
          apply to `re_export`, which the spec's own `visibility` enum
          gates per item.
        type: string
        minLength: 1

  reverse:
    description: |
      `reverse` pre-flight policy (#102).
    type: object
    additionalProperties: false
    properties:
      vocabulary:
        description: |
          Where the reverse-engineering vocabulary comes from. `blocks`
          (default): inlined block schemas; zero inlined blocks and no
          `--into` is REVERSE-002 (error). `profile`: the profile's own
          schema is the vocabulary; zero inlined blocks is REVERSE-004
          (info) and the run proceeds.
        type: string
        enum: [blocks, profile]

  bootstrap:
    description: |
      Bootstrap-time pipeline. Today, only `rust-workspace` populates
      `bootstrap.steps`; standalone profiles use empty list.
    type: object
    additionalProperties: false
    properties:
      steps:
        description: |
          BootstrapStep[] (closed enum). Ordered list; analyzer follows
          verbatim.
        type: array
        items:
          type: string
          enum: [emit_workspace_root, emit_member_stubs, walk_members]

  context:
    description: |
      `prompt --module` and `context --module` dispatch.
    type: object
    additionalProperties: false
    properties:
      module_fields_for_prompt:
        description: |
          Top-level module-spec field names that contribute to the
          assembled codegen prompt.
        type: array
        items:
          type: string
      context_subcommand_extras:
        description: |
          Profile-specific buckets surfaced by `context --module`. Each
          entry is one bucket; sub-shape is open in step 1 (the two
          shipped shapes are `{field, from_attr}` and
          `{field, kind: collect_local_entities_by_kind, kinds[]}`).
        type: array
        items:
          type: object

  surface:
    description: |
      validate-pass routing. Replaces `layout.spec.workspace.is_some()`
      heuristics in Batch A with declarative profile-driven flags.
    type: object
    additionalProperties: false
    properties:
      has_modules:
        description: |
          When false, validate-pass suppresses LAYOUT-003 on
          module.schema.yaml absence (and any other no-module-surface
          heuristics — see doc 21 §8 step 8 audit).
        type: boolean
      has_requirements:
        description: |
          When false, validate-pass suppresses LAYOUT-003 on
          requirements.schema.yaml absence.
        type: boolean
      has_architecture:
        description: |
          When false, validate-pass suppresses LAYOUT-005-style
          absent-warnings on architecture.toml.
        type: boolean
