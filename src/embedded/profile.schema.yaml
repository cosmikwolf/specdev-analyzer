$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schema/meta/v1/profile.schema.yaml"
title: "profile manifest (contract 2)"
description: |
  Validates `profiles/<name>/profile.yaml`. Authored on the plugin side;
  byte-copied into a project at `specs/specdev/profile.yaml` during
  bootstrap. Declares the profile's language, the config files bootstrap
  writes, the compile gates, extraction and reverse policy,
  context-subcommand extras, and validate-pass surface flags. Contract 2
  dropped the manifest-emitter sections (`cargo_toml`, `pubspec_yaml`,
  `package_json`, `derived_files`) and the gate `scope`; the loader drops
  them from a contract-1 manifest before this schema runs.

  The project's copy IS drift-tracked: bootstrap records every
  profile-scaffolded file's post-substitution hash under `[profile_files]`
  in `lineage.toml`, so `drift` reports this file the way it reports an
  inlined block's (#109). The older claim that a profile "leaves no
  ongoing dependency" was written when profiles shipped only templates and
  prose; a profile now ships the schemas and this manifest, which every
  command reads.

type: object
additionalProperties: false
required: [name, language]
properties:
  contract_version:
    description: |
      The `profile.schema.yaml` contract this manifest is authored
      against. Compared against the analyzer's embedded
      `PROFILE_CONTRACT_VERSION` **before** this schema runs, so a
      plugin newer than the analyzer reports one `MANIFEST-002` naming
      the remedy instead of a pile of `additionalProperties` errors
      naming the user's own file (#117).

      **Optional here, mandatory on the plugin side.** The asymmetry is
      deliberate: this schema also validates project trees bootstrapped
      before the field existed, and those must keep validating, so an
      absent value means contract 1. `plugin-lint` requires the field
      on every `profiles/*/profile.yaml`, because a plugin author who
      omits it at a contract bump reopens #117 for every older binary.
    type: integer
    minimum: 1
  name:
    description: |
      Profile name. MUST match the plugin-tree directory name.
      Lowercase kebab-case identifier.
    type: string
    pattern: "^[a-z][a-z0-9-]*$"

  language:
    description: |
      Target language. References the `languages/<lang>/` tier. Must stay
      in lockstep with the spec schema's `project.language` enum — a
      language is admitted to both enums in the same change, alongside
      its adapter.
    type: string
    enum: [rust, c, cpp, dart, typescript]

  paired_files:
    description: |
      Profile-shipped config files written **once when absent**
      by `manifest --write`, then externally owned — never rewritten,
      never gen-recorded (the category `next build`'s `tsconfig.json`
      rewrite forces). Language-neutral: applied by the shared manifest
      runner for every language, merged with the rust arm's `[[bin]]`
      paired stub. `template_file` is read from the inlined
      `<specdev_root>/templates/` copy; the only token substituted is
      `{project_name}`. `target` is project-root-relative; a target the
      manifest emitter or a `bin.paired_stub` also writes is refused at
      manifest time (two writers, one path).
    type: array
    items:
      type: object
      additionalProperties: false
      required: [template_file, target]
      properties:
        template_file:
          description: |
            Path under `profiles/<name>/`, e.g.
            `templates/tsconfig.json.template`.
          type: string
          minLength: 1
        target:
          description: |
            Project-root-relative path to write, e.g. `tsconfig.json`
            or `app/.gitkeep`. Missing parent directories are created.
          type: string
          minLength: 1

  gates:
    description: |
      The compile-gate registry: every gate the project's gate script and
      CI run, as data. Each gate is an opaque `label` and `steps` — a list
      of argv lists run in order in the project root, never a shell
      string (one exit code per step; no second grammar for quoting). A
      `${root.<table>.<field>}` token in a step resolves against
      `specs/architecture.toml`; a missing field is an error, never an
      empty string. A second row with the same label is refused at load.
      Labels are opaque to the analyzer.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [label, steps]
      properties:
        label:
          description: |
            Opaque gate name, e.g. `cargo-check` or `fast`; the value the
            runner is invoked with. No whitespace.
          type: string
          minLength: 1
          pattern: "^\\S+$"
        steps:
          description: |
            Argv lists, run in order; the first non-zero exit stops the
            gate and fails it. Each list is one process: executable
            first, then its arguments, one string per argument.
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1

  items:
    description: |
      items[] extraction policy (#101(b)). Read by `extract-items`,
      `items diff` and the validate pass's `verified_by` resolution.
    type: object
    additionalProperties: false
    properties:
      visibility_floor:
        description: |
          Lowest source visibility the extractor treats as contract
          surface. An OPAQUE string: the analyzer never interprets it —
          the language adapter compares each captured `<kind>.vis`
          against it (Rust: `pub` ⊃ `pub(crate)` ⊃ `pub(super)`; Dart
          has no modifiers and ignores the key). Absent → the adapter's
          own default (Rust: `pub`). A binary-shaped profile whose
          contract surface is crate-wide declares `pub(crate)`. Does not
          apply to `re_export`, which the spec's own `visibility` enum
          gates per item.
        type: string
        minLength: 1

  reverse:
    description: |
      `reverse` pre-flight policy (#102).
    type: object
    additionalProperties: false
    properties:
      vocabulary:
        description: |
          Where the reverse-engineering vocabulary comes from. `blocks`
          (default): inlined block schemas; zero inlined blocks and no
          `--into` is REVERSE-002 (error). `profile`: the profile's own
          schema is the vocabulary; zero inlined blocks is REVERSE-004
          (info) and the run proceeds.
        type: string
        enum: [blocks, profile]

  bootstrap:
    description: |
      Bootstrap-time pipeline. Today, only `rust-workspace` populates
      `bootstrap.steps`; standalone profiles use empty list.
    type: object
    additionalProperties: false
    properties:
      steps:
        description: |
          BootstrapStep[] (closed enum). Ordered list; analyzer follows
          verbatim.
        type: array
        items:
          type: string
          enum: [emit_workspace_root, emit_member_stubs, walk_members]

  context:
    description: |
      `prompt --module` and `context --module` dispatch.
    type: object
    additionalProperties: false
    properties:
      context_subcommand_extras:
        description: |
          Profile-specific buckets surfaced by `context --module`. Each
          entry is one bucket; sub-shape is open in step 1 (the two
          shipped shapes are `{field, from_attr}` and
          `{field, kind: collect_local_entities_by_kind, kinds[]}`).
        type: array
        items:
          type: object

  surface:
    description: |
      validate-pass routing. Replaces `layout.spec.workspace.is_some()`
      heuristics in Batch A with declarative profile-driven flags.
    type: object
    additionalProperties: false
    properties:
      has_modules:
        description: |
          When false, validate-pass suppresses LAYOUT-003 on
          module.schema.yaml absence, and any other no-module-surface
          heuristic.
        type: boolean
      has_requirements:
        description: |
          When false, validate-pass suppresses LAYOUT-003 on
          requirements.schema.yaml absence.
        type: boolean
      has_architecture:
        description: |
          When false, validate-pass suppresses LAYOUT-005-style
          absent-warnings on architecture.toml.
        type: boolean
