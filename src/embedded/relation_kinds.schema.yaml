$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schema/meta/v1/relation_kinds.schema.yaml"
title: "Canonical relation kinds (v1)"
description: >
  Closed vocabulary of relation kinds. Adding a new canonical relation
  requires a metaschema version bump. Block-/bridge-contributed relations
  declare `extends:` against this enum. Embedded in the analyzer rather
  than read from the plugin tree, so analysis needs no plugin lookup.

$defs:
  RelationKind:
    type: string
    enum:
      - contains      # structural → any         parent-child / aggregation
      - depends_on    # structural → structural  compile/link/invocation dependency
      - connects      # structural → structural  port-to-port wiring
      - satisfies     # structural → statement   requirement satisfaction
      - transitions   # state → state            state machine transition (attrs: event, guard, effect)
      - emits         # behavioral → event       this action/transition emits this event
      - handles       # event → behavioral       this event is handled by this action/transition
      - typed_as      # structural → data        this entity (port, param, field) has this type
