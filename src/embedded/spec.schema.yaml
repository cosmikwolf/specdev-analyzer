$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schemas/spec.toml.v1"
title: spec.toml
description: |
  JSON Schema for the project-level `spec.toml` manifest. Embedded in the
  analyzer crate; the analyzer is the source of truth for what a valid
  `spec.toml` is. It is never loaded from a plugin, so analysis needs no
  resolution chain.
type: object
additionalProperties: false
required: [spec_version, project, paths]
properties:
  spec_version:
    type: string
    description: |
      Project format version. `1.x` keeps decisions, requirements, sources
      and open questions in one file per kind under `specs/`; `2.x` keeps
      one file per entry (`specs/decisions/<id>.toml`, …). This analyzer
      reads both; `migrate` moves a `1.x` project to `2.0`.
    pattern: "^[12]\\.[0-9]+$"
  project:
    type: object
    additionalProperties: false
    required: [name, profile, language]
    properties:
      name:
        type: string
        description: Project name. Lowercase letters, digits, underscores, hyphens; must start with a letter.
        pattern: "^[a-z][a-z0-9_-]*$"
        maxLength: 64
      profile:
        type: string
        description: Profile owning the project shape (e.g. firmware-layered, library-api).
        pattern: "^[a-z][a-z0-9_-]*$"
      language:
        type: string
        description: |
          Project language. Must stay in lockstep with the
          profile schema's `language` enum — a language is admitted to
          both enums in the same change, alongside its adapter.
        enum: [rust, c, cpp, dart, typescript, python]
      toolchain:
        type: string
        description: |
          The project's tool, for a language with more than one (Python:
          `uv`, `poetry`, `pip`). It must name a toolchain the profile's
          `toolchains:` lists; the profile gives that tool's gates and
          lockfiles, and `check` reports a lockfile of another tool.
        pattern: "^[a-z][a-z0-9_-]*$"
      max_parallel_agents:
        type: integer
        minimum: 1
        description: |
          How many agents may edit this project at once, each in its own
          git worktree. `bootstrap` and `migrate` write `1`; a person
          raises it. Skills read it before they launch parallel work.
  paths:
    type: object
    additionalProperties: false
    required: [specs, source]
    properties:
      specs:
        type: string
        description: Directory containing the project's specs/ tree (machinery + module files), relative to spec.toml. Conventionally "specs".
        minLength: 1
      source:
        type: string
        description: Source code directory the analyzer audits/reverses against, relative to spec.toml. Conventionally "src".
        minLength: 1
      plugin_root:
        type: string
        description: |
          Optional path to the plugin tree, relative to spec.toml. When set, this overrides the
          SPECDEV_PLUGIN_ROOT and CLAUDE_PLUGIN_ROOT environment variables for inline / bootstrap
          / inline-bridge commands. The CLI flag --plugin-root still takes precedence over this
          field. Multi-package workspaces may legitimately set this per-package;
          conflicting values across packages are accepted at CLI time.
        minLength: 1
      tests:
        type: array
        description: |
          Optional extra test roots, relative to spec.toml, for tests that live outside `source`
          and outside the language's conventional test locations (for example a bench crate's
          `tests/`). Test discovery walks `source`, these roots, and the conventional locations.
        items: { type: string, minLength: 1 }
        uniqueItems: true
  workspace:
    description: |
      Workspace marker. Presence signals "this spec.toml
      describes a Cargo workspace root"; member crates' Cargo.toml
      emission walks up to find this marker and renders `*.workspace =
      true` for inherited package fields. Optional — only `rust-workspace`
      profile projects set this table. The `[[members]]` array enumerates
      member crates; member `name` and `path` are validated against
      member spec.toml `[project].name` at validate time.
    type: object
    additionalProperties: false
    required: [members]
    properties:
      members:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name, path]
          properties:
            name:
              description: Member crate name. Must match the member's `[project].name`.
              type: string
              pattern: "^[a-z][a-z0-9_-]*$"
              maxLength: 64
            path:
              description: Path to the member crate, relative to this spec.toml.
              type: string
              minLength: 1
