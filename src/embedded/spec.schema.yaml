$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/schemas/spec.toml.v1"
title: spec.toml
description: |
  JSON Schema for the project-level `spec.toml` manifest. Embedded in the
  analyzer crate; the analyzer is the source of truth for what a valid
  `spec.toml` is. Phase 1 invariant 5 (no resolution chain at analyze time)
  forbids loading this from a plugin.
type: object
additionalProperties: false
required: [spec_version, project, paths]
properties:
  spec_version:
    type: string
    description: Schema version line. v1 accepts only `1.x`; later versions widen.
    pattern: "^1\\.[0-9]+$"
  project:
    type: object
    additionalProperties: false
    required: [name, profile, language]
    properties:
      name:
        type: string
        description: Project name. Lowercase letters, digits, underscores, hyphens; must start with a letter.
        pattern: "^[a-z][a-z0-9_-]*$"
        maxLength: 64
      profile:
        type: string
        description: Profile owning the project shape (e.g. firmware-layered, library-api).
        pattern: "^[a-z][a-z0-9_-]*$"
      language:
        type: string
        description: |
          Target language for codegen. Must stay in lockstep with the
          profile schema's `language` enum — a language is admitted to
          both enums in the same change, alongside its adapter.
        enum: [rust, c, cpp, dart]
      edition:
        type: string
        description: |
          Rust edition. Optional; defaults to "2021" if absent. Phase 8's
          `gen` emits this as Cargo.toml's `[package].edition` for Rust
          projects. Ignored for non-Rust languages.
        enum: ["2018", "2021", "2024"]
        default: "2021"
      license:
        type: string
        description: |
          SPDX license identifier (or "OR"-joined identifiers). Optional;
          libraries should set this. Phase 8's `gen` emits as
          Cargo.toml's `[package].license`.
        minLength: 1
      description:
        type: string
        description: |
          Short project description. Optional; libraries should set this
          (it appears on crates.io). Phase 8's `gen` emits as
          Cargo.toml's `[package].description`.
        maxLength: 200
      repository:
        type: string
        description: |
          Repository URL (Phase 8.6+). Optional; libraries that publish
          to crates.io should set this. For workspace members this
          field is normally omitted — the workspace owns the canonical
          value via `[workspace_package].repository` and members emit
          `repository.workspace = true`.
        minLength: 1
      crate_shape:
        type: string
        enum: [binary, library]
        description: |
          Per-package Cargo crate-target override (F12-22). Optional;
          absent = the profile's own `cargo_toml.shape`. A `binary`-shaped
          profile (firmware-layered) renders `[[bin]]`/`src/main.rs` by
          default; set `crate_shape = "library"` on a workspace member that
          is a driver/HAL-shim *library* so its Cargo.toml renders
          `[lib]`/`src/lib.rs` instead — keeping the same block, bridge, and
          architecture dependencies. Generic Cargo concept, not a profile or
          block name.
  paths:
    type: object
    additionalProperties: false
    required: [specs, source]
    properties:
      specs:
        type: string
        description: Directory containing the project's specs/ tree (machinery + module files), relative to spec.toml. Conventionally "specs".
        minLength: 1
      source:
        type: string
        description: Source code directory the analyzer audits/reverses against, relative to spec.toml. Conventionally "src".
        minLength: 1
      plugin_root:
        type: string
        description: |
          Optional path to the plugin tree, relative to spec.toml. When set, this overrides the
          SPECDEV_PLUGIN_ROOT and CLAUDE_PLUGIN_ROOT environment variables for inline / bootstrap
          / inline-bridge commands. The CLI flag --plugin-root still takes precedence over this
          field. Per doc 15 §9.2, multi-package workspaces may legitimately set this per-package;
          conflicting values across packages are accepted at CLI time.
        minLength: 1
  workspace:
    description: |
      Workspace marker (Phase 8.6+). Presence signals "this spec.toml
      describes a Cargo workspace root"; member crates' Cargo.toml
      emission walks up to find this marker and renders `*.workspace =
      true` for inherited package fields. Optional — only `rust-workspace`
      profile projects set this table. The `[[members]]` array enumerates
      member crates; member `name` and `path` are validated against
      member spec.toml `[project].name` at validate time.
    type: object
    additionalProperties: false
    required: [members]
    properties:
      resolver:
        description: |
          Cargo resolver version. Emitted as `[workspace] resolver =
          "..."`. Defaults to "2" if absent (Cargo's recommended).
        type: string
        enum: ["1", "2", "3"]
      members:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name, path]
          properties:
            name:
              description: Member crate name. Must match the member's `[project].name`.
              type: string
              pattern: "^[a-z][a-z0-9_-]*$"
              maxLength: 64
            path:
              description: Path to the member crate, relative to this spec.toml.
              type: string
              minLength: 1
