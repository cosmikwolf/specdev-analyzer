# Architecture-level decisions for a library-api project.
#
# This file declares MSRV (optional) + the cargo features
# the library exposes. Module-level external_deps live in each
# specs/modules/*.toml; the union determines the library's full dep
# set, which codegen emits to Cargo.toml.

# ---------------------------------------------------------------------------
# Minimum Supported Rust Version (optional). Cargo-style version
# requirement; emitted as Cargo.toml's `rust-version` field.
# ---------------------------------------------------------------------------
# msrv = "1.75"

# ---------------------------------------------------------------------------
# Cargo features exposed by the library.
#
# Each [[features]] entry declares one feature. Modules reference these
# features via their top-level `feature_gates = [...]` array; the
# `module_feature_gates_resolve` graph check verifies every reference
# resolves to a declared feature here.
#
# `depends_on` lists features that must be enabled for this feature to
# be meaningful (cargo's feature dependency syntax).
#
# `default = true` puts the feature in the crate's `[features] default`
# set. At most one feature per cargo project should be `default = true`
# unless you genuinely intend multiple defaults.
#
# Delete the EXAMPLE entries below once the library has its own real
# features; for a library with no optional features at all, leave this
# file empty (just the comment header is fine).

# EXAMPLE: a default `std` feature with no dependencies.
# [[features]]
# name = "std"
# description = "Use Rust's std library; disable for no_std builds."
# default = true

# EXAMPLE: an optional `alloc` feature requiring nothing else.
# [[features]]
# name = "alloc"
# description = "Use the alloc crate (heap-allocated types)."

# EXAMPLE: a feature that pulls in another feature.
# [[features]]
# name = "serde"
# description = "Serialize/deserialize support via serde."
# depends_on = ["std"]

# ---------------------------------------------------------------------------
# Crate-wide dependencies — crates the library uses as a whole, or
# workspace-inherited / path deps on sibling crates. Every entry lands in
# Cargo.toml [dependencies] (`test_only = true` → [dev-dependencies]).
# Keep a crate that only one module needs in that module's external_deps.
# ---------------------------------------------------------------------------
# [[external_deps]]
# crate = "serde"
# version = "1.0"
# source = "workspace"
# features = ["derive"]

# [[external_deps]]
# crate = "proptest"
# version = "1.0"
# source = "workspace"
# test_only = true

# ---------------------------------------------------------------------------
# Cargo build profiles ([profile.*]) — for a STANDALONE crate only. In a
# workspace, profiles live in the workspace root's architecture.toml;
# Cargo ignores them in a member manifest and validate rejects them here.
# Closed subset: opt-level, debug, lto, codegen-units, panic, strip,
# overflow-checks, debug-assertions, incremental, plus package.<crate>
# overrides (no panic / lto there).
# ---------------------------------------------------------------------------
# EXAMPLE: a smaller release binary.
# [profiles.release]
# lto = "fat"
# codegen-units = 1
# strip = true
