# Manifest — Cargo deps the eframe block contributes.
# Schema: specdev-analyzer/src/embedded/block_deps.schema.yaml.
#
# Pinned to eframe 0.36. Two things to know about this pin:
#
# 1. eframe 0.36 requires rustc 1.95 or newer. The reference crate carries
#    a rust-toolchain.toml pinning `stable` so it builds regardless of the
#    ambient default toolchain.
#
# 2. `egui` is deliberately NOT listed. eframe re-exports it as
#    `eframe::egui`, and the versions are locked together upstream.
#    Declaring egui separately here would let a project end up with two
#    incompatible egui versions whose types do not unify — a confusing
#    failure well downstream of its cause. Emit `eframe::egui::...`.
#
# NOTE: `purpose` is capped at 80 characters by block_deps.schema.yaml.

crates:
  - name: eframe
    version: "0.36"
    features: ["persistence", "glow"]
    source: crates-io

  # Persisted values are serialized through serde; required whenever
  # `[[eframe.persisted]]` has any entry.
  - name: serde
    version: "1"
    features: ["derive"]
    source: crates-io

recommended_external_deps:
  - crate: egui_extras
    purpose: "Tables, image loaders and date pickers egui core omits."
  - crate: env_logger
    purpose: "Surfacing eframe's log output when a window fails to open."
