# Manifest — Cargo deps the egui block contributes.
# Schema: specdev-analyzer/src/embedded/block_deps.schema.yaml.
#
# This block contributes NO crates, deliberately. It models editor topology
# (panels, regions, purposes), which is host-agnostic; the egui crate itself
# always arrives from whichever host the project inlines:
#
#   eframe (native app)     -> the `eframe` block, via `eframe::egui`
#   nih-plug (plugin editor) -> the `egui+nih-plug` bridge, via
#                               `nih_plug_egui::egui`
#
# The host also emits `pub use <host>::egui;` at the crate root, and this
# block's emitted code refers to `crate::egui`. Contributing an egui version
# here would put a second, independently-versioned egui in the dependency
# graph alongside the host's, whose types would not unify — a confusing
# failure well downstream of its cause. Two hosts in one crate now collide
# at the single `pub use` line instead, which is a clear error at the point
# that caused it.
#
# A block with no crates is valid: `crates` is optional in the deps manifest
# schema. `recommended_external_deps` still applies — it suggests, it does
# not inject.

recommended_external_deps:
  - crate: egui_extras
    purpose: "Tables, image loaders and date pickers egui core omits."
