$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/blocks/egui.v1"
title: "egui block (v1)"
description: >
  Schema fragment contributed by the `egui` block. Adds a namespaced
  `[egui]` table to `Module` carrying interface topology — panels and
  regions — for any module that draws with
  [egui](https://github.com/emilk/egui).

  v1 models **topology only**: the block describes WHERE controls live
  (panel layout, region positions, region purpose) but NOT WHICH
  widgets render WHICH values. Value→widget bindings live in a bridge
  against whichever unit owns the values. Custom drawing (plots,
  visualizers, spectrum analyzers) is declared structurally via
  `purpose = "free_form"` regions and hand-authored Rust inside the
  code.

  The block is **host-neutral** and contributes no crates: egui itself
  arrives from the host the project inlines (`eframe::egui` from the
  `eframe` block, `nih_plug_egui::egui` from the `egui+nih-plug`
  bridge). See the block README's `EGUI-NEEDS-A-HOST` section.

  This separation lets the egui block stay small (5 panel kinds, 5
  region purposes, a few layout attributes) and lets new widget kinds
  extend a bridge without touching this block.

  This schema is self-contained: identifier patterns are inlined rather
  than $ref'd against profile-shipped enums.schema.yaml so the block
  composes against any profile that exposes `Module`.
type: object
properties:
  egui:
    type: object
    additionalProperties: false
    properties:
      default_size:
        description: >
          Optional preferred size of the drawn surface. The host uses
          this when it has no size of its own; a host that declares its
          own window geometry wins and this is ignored. The host may
          resize at runtime if `resizable = true`.
        type: object
        additionalProperties: false
        required: [width, height]
        properties:
          width:  { type: integer, minimum: 1 }
          height: { type: integer, minimum: 1 }
      resizable:
        description: >
          When true, the host may resize the drawn surface. Defaults
          to false. Hosts that own a resizable window of their own
          (an `[eframe]` window does) declare it on their own table.
        type: boolean
        default: false
      panels:
        description: >
          Panels — each becomes one of egui's panel types
          (CentralPanel, SidePanel, TopBottomPanel) in the code.
          Order is significant: side / top / bottom panels must be
          declared before the central panel, because each removes its
          strip from the available area and the central panel fills
          what is left. The code has in the order panels are listed.
        type: array
        items: { $ref: "#/$defs/Panel" }
        minItems: 1
      regions:
        description: >
          Regions inside panels. Each carries a `purpose` that drives
          the shape of the code (see this block's
          guidance). Cross-cutting binding (value→widget) lives in a
          bridge against the unit that owns the values, not here.
        type: array
        items: { $ref: "#/$defs/Region" }

$defs:
  Identifier:
    description: snake_case or PascalCase identifier usable as a Rust ident.
    type: string
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"

  Panel:
    description: >
      One panel. egui supports CentralPanel (one per surface),
      SidePanel (left or right), and TopBottomPanel (top or bottom).
      The panel `kind` drives the egui type; `id` is the panel's
      stable name for cross-region references.
    type: object
    additionalProperties: false
    required: [id, kind]
    properties:
      id:
        $ref: "#/$defs/Identifier"
      kind:
        description: >
          Panel position. `central` is the main panel (one per
          surface; egui requires it last in the paint callback).
          `side_left` / `side_right` are vertical strips on the
          edges. `top` / `bottom` are horizontal strips. The code uses the
          matching egui panel type (central, side, top/bottom) in the
          panel API generation the host's egui has.
        type: string
        enum: [central, side_left, side_right, top, bottom]
      width:
        description: >
          Optional initial width (px) for `side_left` / `side_right`
          panels. Hosts may resize when `[egui].resizable = true`;
          the code uses this as the SidePanel's `default_width`. Has
          no effect on `central` / `top` / `bottom` panels (their
          widths are determined by the surface).
        type: integer
        minimum: 1
      height:
        description: >
          Optional initial height (px) for `top` / `bottom` panels.
          The code uses this as the TopBottomPanel's `default_height`.
          Has no effect on `central` / `side_left` / `side_right`
          panels.
        type: integer
        minimum: 1

  Region:
    description: >
      A region inside a panel. Regions group widgets by purpose; the
      `purpose` enum drives the shape of the code (see this
      block's guidance).
    type: object
    additionalProperties: false
    required: [id, panel, purpose]
    properties:
      id:
        $ref: "#/$defs/Identifier"
      panel:
        description: >
          Id of the panel this region lives inside. Must reference a
          declared `[[egui.panels]]` id; the
          `region_in_panel` reduction relation surfaces unresolved
          references at validate time.
        $ref: "#/$defs/Identifier"
      purpose:
        description: |
          Region role. Decides the region body per the table:

            parameter_controls — region holds widgets bound to values
                                 a bridge declares (the `egui+nih-plug`
                                 bridge's `parameter_widgets[]` is the
                                 shipped case). The code has a
                                 placeholder marker the bridge fills
                                 in; with no such bridge inlined the
                                 region body is hand-authored.
            metering           — region displays values published from
                                 another thread, typically `Atomic*`
                                 cells. The code has the read-side
                                 boilerplate; user fills in the
                                 visualization (level meter, LED, etc.).
            preset_selector    — region renders a saved-configuration
                                 picker (combo box + prev/next buttons
                                 + save/load). The code has the
                                 standard pattern.
            free_form          — region body is hand-authored.
                                 The code has a TODO marker and
                                 leaves the body open.
            label_block        — region renders static text (section
                                 headers, instructions) with
                                 `ui.label(...)` calls.
        type: string
        enum:
          - parameter_controls
          - metering
          - preset_selector
          - free_form
          - label_block
      layout:
        description: >
          Optional layout direction inside the region. `grid` arranges
          children in a grid (requires `columns`); `vertical` stacks
          children top-to-bottom; `horizontal` arranges
          left-to-right. Defaults to `vertical`. The code wraps the
          region body in `egui::Grid::new(id).num_columns(N)` for
          `grid`, `ui.vertical(|ui| {...})` for vertical, and
          `ui.horizontal(|ui| {...})` for horizontal.
        type: string
        enum: [grid, vertical, horizontal]
      columns:
        description: >
          Column count when `layout = "grid"`. Required for grid
          layouts; ignored otherwise (the code has a warning if set
          on non-grid layouts).
        type: integer
        minimum: 1
