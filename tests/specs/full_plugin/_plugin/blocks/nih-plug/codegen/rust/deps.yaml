# Manifest — Cargo deps the nih-plug block contributes.
# Schema: specdev-analyzer/src/embedded/block_deps.schema.yaml.
#
# Inlined alongside codegen/rust/README.md during `specdev inline nih-plug`;
# participates in the block's per-unit content_hash.
#
# `rev` is intentionally omitted: nih-plug is git-only (not on crates.io)
# and the project author chooses the pin via architecture.toml's
# `[[external_deps]]` override. The block's codegen/rust/README.md
# documents `rev = "<pin>"` as the convention. Cargo accepts git deps
# without a rev (HEAD of default branch); reproducibility lands when the
# project pins.

crates:
  - name: nih_plug
    version: "0.0"                # nih-plug ships 0.x git tags only
    features: []
    source:
      git: "https://github.com/robbert-vdh/nih-plug.git"

recommended_external_deps:
  - crate: nih_plug
    purpose: "plugin trait + parameter system"
