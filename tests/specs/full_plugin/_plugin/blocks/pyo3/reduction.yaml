metaschema_version: "v1"

# pyo3 block reduction. Each entry kind materializes as an entity under the
# `pyo3` namespace (`pyo3.PyModule`, `pyo3.Class`, `pyo3.Function`,
# `pyo3.Exception`), named `<Module>.<entry>` so several modules' entries
# coexist. No relations: which module exports what is the code's business,
# and the import of the built module is the Python package's test.

entities:
  - kind: PyModule
    extends: Module
    from: "specs/modules/*.toml"
    for_each: "pyo3.modules[]"
    name: "${root.name}.${.name}"

  - kind: Class
    extends: Module
    from: "specs/modules/*.toml"
    for_each: "pyo3.classes[]"
    name: "${root.name}.${.name}"

  - kind: Function
    extends: Module
    from: "specs/modules/*.toml"
    for_each: "pyo3.functions[]"
    name: "${root.name}.${.name}"

  - kind: Exception
    extends: Module
    from: "specs/modules/*.toml"
    for_each: "pyo3.exceptions[]"
    name: "${root.name}.${.name}"

relations: []
