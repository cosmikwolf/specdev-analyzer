metaschema_version: "v1"

# stm32h5-rs block reduction. Peripherals and pins each materialize as
# entities under the `stm32h5-rs` namespace. Entity kind paths resolve
# to `stm32h5-rs.Peripheral` and `stm32h5-rs.Pin`.
#
# Both extend Module — they're sub-units of a module's hardware
# composition. Qualified entity names combine parent module name with
# the local name so multiple modules' peripherals/pins coexist without
# collision.
#
# v1 declares no relations. Cross-peripheral wiring (e.g. "this GPDMA
# channel serves this UART") could become a relation in v2 if a project
# needs graph-check coverage; for now, that wiring is implicit in the
# codegen prose.

entities:
  - kind: Peripheral
    extends: Module
    from: "specs/modules/*.toml"
    for_each: "stm32h5.peripherals[]"
    name: "${root.name}.${.name}"
    attrs:
      kind: ".kind"
      instance: ".instance"

  - kind: Pin
    extends: Module
    from: "specs/modules/*.toml"
    for_each: "stm32h5.pins[]"
    name: "${root.name}.${.name}"
    attrs:
      port: ".port"
      pin: ".pin"
      alt_fn: ".alt_fn"
      mode: ".mode"

relations: []
