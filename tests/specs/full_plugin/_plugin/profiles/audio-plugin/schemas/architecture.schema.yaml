$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/audio-plugin/architecture.schema.yaml"
title: "audio-plugin architecture spec (v1)"
description: |
  Shape of `specs/architecture.toml` for an audio-plugin project. Holds the
  project-wide decisions list only. The plugin's identity (name, vendor,
  category, formats), its buses and its panic strategy are constants in the
  plugin's code and settings in `Cargo.toml`; the profile's implementation
  guidance (`guidance.md`) gives their rules.
type: object
additionalProperties: false
properties:
  project_decisions:
    description: >
      Decision ids that shape the project as a whole (workspace shape,
      build order, MSRV policy, public API conventions). Distinct from
      module-scope `guided_by`: project_decisions describes commitments
      that span the architecture itself rather than any one module's
      implementation. Validated by graph check
      `architecture_project_decisions_resolves`.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/RequirementId" }
    uniqueItems: true
