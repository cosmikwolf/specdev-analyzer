$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/audio-plugin/module.schema.yaml"
title: "audio-plugin module spec (v1)"
description: >
  Shape of a single module spec in `specs/modules/*.toml` for an
  audio-plugin project. One module per file; filename should match the
  `name` field. Each module declares its `layer` (per the four-tier
  audio-plugin LayerKind: host_interface → plugin_shell → engine →
  dsp_node); the `layer_dependency` graph check enforces downward-only
  dependencies.

  The module schema is fresh-designed (not extended from library-api).
  The plugin shell is a cdylib whose contract is the host's C ABI
  (exposed via `nih_export_*!` macros) —
  Rust-level re-exports don't reach the host, so no `re_exports[]`
  field. `feature_gates[]` is included because Cargo features are
  build-time toggles relevant to plugin authoring (e.g., conditional
  MIDI handling, SIMD-vs-scalar DSP backends).

  `bindings` is open in v1; the `egui+nih-plug` canonical bridge
  contributes `bindings."egui+nih-plug".parameter_widgets[]`. Other
  bridges may add further `bindings.<a>+<b>` entries.

  `[nih_plug]` and `[egui]` block tables are contributed via inlined
  block schemas; the `unevaluatedProperties: false` setting allows
  those keys through the aggregator's `allOf` slot.
type: object
unevaluatedProperties: false
required: [name, layer]
properties:
  name:
    $ref: "enums.schema.yaml#/$defs/Identifier"
  layer:
    $ref: "enums.schema.yaml#/$defs/LayerKind"
  description:
    type: string
  depends_on:
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/ModuleRef" }
    uniqueItems: true
  external_deps:
    description: |
      External crate dependencies this module needs (CrateReference
      shape). Each entry becomes a Cargo.toml
      `[dependencies]` line at gen time; the union with
      architecture-level `[[external_deps]]` determines the project's
      full dep set. Use this for module-scoped crates that aren't
      project-wide infrastructure (e.g., a DSP module pulling in
      `biquad` for filter primitives).
    type: array
    items:
      $ref: "https://specdev.dev/schema/meta/v1/crate_reference.schema.yaml#/$defs/CrateReference"
  feature_gates:
    description: >
      Cargo features that conditionally include this module. The module
      compiles only when at least one of the listed features is active
      (treated as `#[cfg(any(feature = "f1", feature = "f2"))]`). An
      empty list (or omitted field) means the module is unconditional.
      `module_feature_gates_resolve` verifies every name is declared in
      `architecture.toml`'s `[[features]]` table. Typical audio-plugin
      use: optional MIDI handling, SIMD vs scalar DSP backends,
      debug-only RTT logging.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/FeatureName" }
    uniqueItems: true
  satisfies:
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/RequirementId" }
    uniqueItems: true
  bindings:
    description: >
      Aggregator slot for bridge contributions. The `egui+nih-plug`
      bridge adds `bindings."egui+nih-plug".parameter_widgets[]`. Open
      in v1.
    type: object
    additionalProperties: true
  parameter_bindings:
    description: >
      Parameter → engine-write bindings. Co-resident with
      `[nih_plug]` on the plugin_shell module: each row maps one
      nih-plug parameter to an engine method/field/custom write, driving
      deterministic `apply_param_changes` emission. Unlike the open
      `bindings.*` slot this is a named property because
      `unevaluatedProperties: false` would otherwise reject it. See the
      `parameter_bindings.schema.yaml` fragment for the row shape and
      the value-transform vocabulary.
    type: array
    items:
      $ref: "parameter_bindings.schema.yaml#/$defs/ParameterBinding"
  items:
    description: >
      Top-level Rust constructs that carry spec significance — items[]
      entry per `pub` function, struct, enum, trait, impl, type, const,
      static, re-export, or macro contributing to the module's
      contractual surface. Sparseness rule (enforced by the language
      schema): every item except `kind = "re_export"` must carry
      `satisfies` (≥1 requirement id). Consumed by `/spec-gen` for
      symbol emission and by the three-stage agentic sync
      (`items diff` / `items propose` / `items apply`). Audio-thread
      methods on the plugin shell take a silence-and-log first-pass
      body rather than `unimplemented!()` because panicking on the
      audio thread would abort-crash the host; see the audio-plugin
      codegen prose's "Audio-thread method bodies" section.
    type: array
    items:
      $ref: "inlined/languages/{{language}}/items.schema.yaml"
    uniqueItems: true
  source_file:
    description: >
      Explicit source-file override for items[] extraction and sync
      (#101(a)). Project-root-relative path (the same base as
      `[paths].source`), e.g. `src/tasks/blink.rs`, `src/display/canvas.rs`
      or `src/lib.rs` for a single-file crate root. When absent the
      analyzer resolves by convention: `<paths.source>/<snake_case(name)>.<ext>`
      plus the language adapter's own candidates (Rust also tries
      `<snake_case(name)>/mod.rs`). Precedence: this override, then the
      adapter candidates, then no source (pre-implementation module — no
      items extracted, never an error). A declared file that does not
      exist on disk resolves to no source as well.
    type: string
    minLength: 1
  context_files:
    description: >
      Per-module list of project-prose files inlined into the codegen
      prompt. Paths are spec-root-relative (directory containing
      `spec.toml`). Validate-time checks ensure each file exists, is
      readable, and is valid UTF-8 (`CONTEXT-001` / `CONTEXT-002` /
      `CONTEXT-003`). Order is preserved at prompt-assembly time;
      files inline in declared order between architecture.toml and the
      module spec. Globs and section anchors are bounded deferrals.
    type: array
    items:
      type: string
      minLength: 1
    uniqueItems: true
  guided_by:
    description: >
      Decision ids that inform this module's implementation but aren't
      pinned to any specific requirement (e.g. naming conventions,
      project-wide build rules). Resolved into the codegen prompt walk
      alongside the requirement-anchored `decided_by` decisions.
      Validated by graph check `module_guided_by_resolves`.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/RequirementId" }
    uniqueItems: true
