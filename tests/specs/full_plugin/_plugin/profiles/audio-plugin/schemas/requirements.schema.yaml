$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/audio-plugin/requirements.schema.yaml"
title: "audio-plugin requirements file (v1)"
description: >
  Shape of one requirement file in `specs/requirements/` for an audio-plugin project (its `[[requirement]]` entries); sources live in `specs/sources/`.
  Identical structurally to the firmware-layered / library-api
  requirements schema — cross-profile parity is intentional so authors
  see the same shape regardless of profile. Modules reference
  requirements by id via their top-level `satisfies` array.
type: object
additionalProperties: false
properties:
  source:
    description: >
      External documents that requirements may be derived
      from. Declared once per source and referenced by id from each
      Requirement's `source` array. Typical audio-plugin sources:
      `vst3-spec`, `clap-spec`, `audio-engine-design-doc`,
      `user-stories`.
    type: array
    items: { $ref: "#/$defs/Source" }
    uniqueItems: true
  requirement:
    type: array
    items: { $ref: "#/$defs/Requirement" }

$defs:
  Source:
    type: object
    additionalProperties: false
    required: [id, kind, title]
    properties:
      id:
        description: >
          Stable identifier referenced by Requirement.source[].
          Lowercase kebab-case (e.g. "clap-spec", "user-stories").
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      kind:
        description: >
          Origin category. `protocol` = external technical spec (VST3,
          CLAP, MIDI 2.0). `user` = stakeholder/user requirements.
          `regulatory` = compliance or certification. `derived` =
          internal decisions with no external document.
        type: string
        enum: [protocol, user, regulatory, derived]
      title:
        type: string
        minLength: 1
      version:
        description: Version or revision of the source document, if applicable.
        type: string
        minLength: 1
      url:
        type: string
        format: uri

  Requirement:
    type: object
    additionalProperties: false
    required: [id, text]
    properties:
      id:
        $ref: "enums.schema.yaml#/$defs/RequirementId"
      text:
        type: string
        minLength: 1
      nature:
        description: >
          What kind of artifact satisfies this requirement (F-006).
          `module` (default) — a Rust module is expected to carry the
          implementation; the `requirements_have_satisfiers` graph
          check warns if no module declares this requirement in its
          `satisfies` array. `architecture` — captured by an
          architecture-level decision (e.g. the export formats, the
          main bus layout) and not a module's responsibility. `build` — captured by build configuration
          (Cargo features, target). `test` — captured by a test suite;
          the `requirements_have_satisfiers` check exempts these;
          `requirements_have_tests` asks for a discovered test named in
          `verified_by`.
        type: string
        enum: [module, architecture, build, test]
        default: module
      satisfies:
        description: >
          Parent requirement ids. Forms a requirement tree for
          traceability.
        type: array
        items: { $ref: "enums.schema.yaml#/$defs/RequirementId" }
        uniqueItems: true
      source:
        description: >
          Ids of Source entries (declared at the top-level `source`
          array, in this or any other requirements file) that this
          requirement is derived from.
        type: array
        items:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        uniqueItems: true
      source_ref:
        description: >
          Free-form locator within the source document(s): section
          number, page, table, clause.
        type: string
        minLength: 1
      planned:
        description: >
          Not built yet. Suppresses only findings about something missing
          (no satisfying module, no test); code that exists is always
          checked. `check --since` reports every new flag.
        type: boolean
      test_pending:
        description: >
          Built, but with no test yet. Exempts only the requirement-to-test
          checks; "has a place" still applies. `check --since` reports every
          new flag.
        type: boolean
      verified_by:
        description: >
          Dotted Module.action identifiers or test names that verify
          this requirement. Free-form for v1.
        type: array
        items: { type: string, minLength: 1 }
      decided_by:
        description: >
          Decision ids that pin this requirement's *how* / *why*.
          Replaces the free-form `source_ref = "DEC-NNN"` pattern with
          a typed reference into `decisions.toml`. Validated by graph
          check `requirement_decided_by_resolves`. Optional — existing
          requirements without this field continue to validate.
        type: array
        items: { $ref: "enums.schema.yaml#/$defs/RequirementId" }
        uniqueItems: true
      retired_by:
        description: >
          Only on a requirement whose file is in
          `specs/requirements/retired/`, where it is required: the
          id of the accepted decision that retired it (or of one that was
          superseded by a chain ending at an accepted decision). The
          folder is the state; this says why. Forbidden on a live
          requirement. The analyzer admits it on retired files whatever
          this schema says.
        type: string
        minLength: 1
