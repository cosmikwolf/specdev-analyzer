# Manifest — drives analyzer dispatch for dart-package projects.
# Schema: specdev-analyzer/src/embedded/profile.schema.yaml.
# Inlined to project at specs/specdev/profile.yaml during bootstrap.

# Contract this manifest is authored against; compared to the
# analyzer's PROFILE_CONTRACT_VERSION before the schema runs (#117).
contract_version: 3

name: dart-package
language: dart

# Config files written once when absent by `specdev-analyzer bootstrap`,
# then owned by the project: never rewritten.
paired_files:
  - { template_file: templates/analysis_options.yaml.template, target: analysis_options.yaml }
  - { template_file: templates/gitignore.template,             target: .gitignore }
  - { template_file: templates/specdev-ci.yml.template,        target: .github/workflows/specdev.yml }

# Compile gates, as data. Dart has one toolchain, so there is one list and no
# `toolchains:`. A regular package does not commit pubspec.lock, so
# `pub get` resolves fresh. `analyze` fails on infos too: pub.dev's score
# counts lints, and so does this gate. `format` fails on unformatted code, which
# pub.dev's score also counts.
gates:
  - label: get
    steps:
      - [dart, pub, get]
  - label: analyze
    steps:
      - [dart, analyze, --fatal-infos]
  - label: format
    steps:
      - [dart, format, --output=none, --set-exit-if-changed, .]
  - label: test
    steps:
      - [dart, test]

bootstrap:
  steps: []                       # standalone package; no workspace machinery

context:
  context_subcommand_extras: []

surface:
  has_modules: true
  has_requirements: true
  has_architecture: true
