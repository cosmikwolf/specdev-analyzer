$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/firmware-layered/architecture.schema.yaml"
title: "firmware-layered architecture spec (v1)"
description: |
  Shape of `specs/architecture.toml` for firmware-layered projects.

  The schema captures project-wide infrastructure picks (platform,
  runtime, logger) AS WELL AS cross-module port connections. Every
  Cargo dep is captured here or in the modules; Cargo.toml is emitted
  by `gen` from these fields. The spec is the source of truth, not
  Cargo.toml.

  Validation here is structural; codegen-time soft checks (e.g.,
  `[platform].mcu_part` consistency with the inlined MCU block) live
  in the block's codegen prose, not in this schema.
type: object
additionalProperties: false
required: [platform]
properties:
  platform:
    description: |
      Hardware platform picks. Required for any firmware-layered
      project — every binary needs a target triple, an MCU family
      crate (e.g. cortex-m), and a runtime (e.g. cortex-m-rt).
    type: object
    additionalProperties: false
    required: [target_triple]
    properties:
      target_triple:
        description: |
          Rust target triple (e.g., "thumbv8m.main-none-eabihf",
          "thumbv7em-none-eabihf"). Drives Cargo build target and
          linker flags.
        type: string
        pattern: "^[a-z][a-z0-9._-]*$"

  connections:
    description: |
      Cross-module port connections. Each entry wires one module's
      port to another. The analyzer verifies at validate time that
      every endpoint references an existing module and an existing
      port on that module (`connection_endpoints_resolve` graph
      check); this schema only enforces shape.
    type: array
    items: { $ref: "#/$defs/Connection" }

  project_decisions:
    description: >
      Decision ids that shape the project as a whole (platform pick,
      runtime model, MSRV policy, public API conventions). Distinct
      from module-scope `guided_by`: project_decisions describes
      commitments that span the architecture itself rather than any
      one module's implementation. Validated by graph check
      `architecture_project_decisions_resolves`.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/RequirementId" }
    uniqueItems: true

$defs:
  Connection:
    type: object
    additionalProperties: false
    required: [from, to]
    properties:
      from:      { $ref: "enums.schema.yaml#/$defs/QualifiedPort" }
      to:        { $ref: "enums.schema.yaml#/$defs/QualifiedPort" }
      flow_type: { type: string }

  Feature:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        $ref: "enums.schema.yaml#/$defs/FeatureName"
      description:
        type: string
      depends_on:
        description: >
          Other features that must be enabled for this feature to be
          meaningful. Each entry must name a declared feature — an
          unknown name is a validate error through the
          `feature_depends_on` relation.
        type: array
        items: { $ref: "enums.schema.yaml#/$defs/FeatureName" }
        uniqueItems: true
      cargo_deps:
        description: >
          Cargo's open-form feature dep strings — accepts `dep:<crate>`
          (enable an optional dep without the implicit-feature shadow),
          `<crate>/<feature>` (enable a feature on a dep), and
          `<crate>?/<feature>` (weak-dep variant). Emitted into the
          generated Cargo.toml `[features]` table verbatim, after the
          `depends_on` entries.

          Use `depends_on` for sibling-feature references (resolved at
          validate time); use this field for cargo-grammar references
          that the spec cannot resolve. Cargo rejects a `dep:` that
          names a crate not marked `optional = true`; the spec does not
          re-check that.
        type: array
        items:
          type: string
          pattern: "^(dep:[a-z0-9_-]+|[a-z0-9_-]+\\??/[a-z0-9_-]+)$"
        uniqueItems: true
      default:
        description: >
          When `true`, this feature is in the crate's `[features]
          default = [...]` set. Defaults to `false`.
        type: boolean
        default: false
