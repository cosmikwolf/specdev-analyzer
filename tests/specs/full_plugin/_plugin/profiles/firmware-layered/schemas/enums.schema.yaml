$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/firmware-layered/enums.schema.yaml"
title: "firmware-layered enums (v1)"
description: >
  Shared closed vocabularies used across the firmware-layered profile.
  Every enum here is a $defs entry; module/architecture/requirements
  schemas reference these via $ref.

$defs:
  LayerKind:
    description: >
      Architectural layer a module belongs to. Dependencies flow downward per
      domain.toml's layer_dependency rule:
      application -> middleware -> driver -> HAL -> PAC.
      `HAL` and `PAC` are uppercase historically; the rest are lowercase.
    type: string
    enum:
      - PAC
      - HAL
      - driver
      - middleware
      - application

  AllocationKind:
    description: How a module's state is allocated.
    type: string
    enum:
      - static_alloc
      - heap_alloc
      - stack_alloc

  ProtectionKind:
    description: Synchronization primitive guarding shared state.
    type: string
    enum:
      - none
      - critical_section
      - mutex
      - atomic
      - disable_interrupts

  ErrorKind:
    description: Error-handling strategy used by the module's API.
    type: string
    enum:
      - panic
      - enum_variant
      - result_type
      - errno
      - option

  BufferOwnerKind:
    description: Who owns the buffers or resources a module handles.
    type: string
    enum:
      - borrowed
      - owned
      - shared

  PortDirection:
    description: Direction of data flow across a port.
    type: string
    enum:
      - in
      - out
      - bidirectional

  ParamDirection:
    description: Direction of an action parameter.
    type: string
    enum:
      - in
      - out
      - inout

  Identifier:
    description: snake_case or PascalCase identifier usable in target languages.
    type: string
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"

  ModuleRef:
    description: >
      Reference to a module: a bare `Module` identifier, or a package-qualified
      `<package>::<Module>` form used in multi-package projects.
    type: string
    pattern: "^([a-z][a-z0-9_]*::)?[A-Za-z_][A-Za-z0-9_]*$"

  QualifiedPort:
    description: >
      `Module.port` or `<package>::<Module>.port` reference used by
      architecture.toml connections.
    type: string
    pattern: "^([a-z][a-z0-9_]*::)?[A-Za-z_][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_]*$"

  RequirementId:
    description: >
      Identifier of a requirement defined in `specs/requirements/`.
      Format: PREFIX-(AREA-)*NUMBER (e.g. REQ-AUDIO-001, ZFM-001, RFC-7-12).
      The leading prefix is open: projects can adopt their published
      requirement scheme (REQ-, ZFM-, RFC-, STORY-, …) without rename
      ceremony. Prefix and AREA tokens are uppercase A-Z and 0-9.
    type: string
    pattern: "^[A-Z0-9]+(-[A-Z0-9]+)*-\\d+$"

  FeatureName:
    description: >
      Cargo feature name. Lowercase, digits, hyphens, underscores.
      Must start with a letter or digit. Matches cargo's accepted
      feature-name grammar.
    type: string
    pattern: "^[a-z0-9][a-z0-9_-]*$"
