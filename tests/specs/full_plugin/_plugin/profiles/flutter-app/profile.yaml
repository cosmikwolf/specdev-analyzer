# Manifest — drives analyzer dispatch for flutter-app projects.
# Schema: specdev-analyzer/src/embedded/profile.schema.yaml.
# Inlined to project at specs/specdev/profile.yaml during bootstrap.

# Contract this manifest is authored against; compared to the
# analyzer's PROFILE_CONTRACT_VERSION before the schema runs (#117).
contract_version: 3

name: flutter-app
language: dart

reverse:
  # A module of this profile names no block field, so its reverse
  # vocabulary is the profile's own schema. The pre-flight reads this and
  # reports REVERSE-004 (info) instead of stopping on REVERSE-002.
  vocabulary: profile

# Config files written once when absent by `specdev-analyzer bootstrap`,
# then owned by the project: never rewritten. The CI workflow installs
# the toolchain the gates need and runs scripts/specdev-gates.sh.
paired_files:
  - { template_file: templates/specdev-ci.yml.template, target: .github/workflows/specdev.yml }

# Compile gate, as data: the gate script (and CI) runs each `steps` argv
# in order in the project root; the first non-zero exit fails the gate.
# `flutter analyze` defaults to `--fatal-infos --fatal-warnings` and would
# fail on one unused import; errors-only matches `cargo check` and the
# rule this gate replaces ("no errors; treat analyzer errors like compile
# errors"). Platform scaffolding is not this gate's finding: `pub get` and
# `analyze` pass with no platform directories.
gates:
  - label: flutter-analyze
    steps:
      - [flutter, pub, get]
      - [flutter, analyze, --no-fatal-infos, --no-fatal-warnings]

bootstrap:
  steps: []                       # standalone app; no workspace machinery

context:
  context_subcommand_extras:
    - field: role
      from_attr: role

surface:
  has_modules: true
  has_requirements: true
  has_architecture: true
