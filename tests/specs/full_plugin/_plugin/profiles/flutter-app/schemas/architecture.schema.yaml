$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/flutter-app/architecture.schema.yaml"
title: "flutter-app architecture spec (v1)"
description: >
  Shape of `specs/architecture.toml` for flutter-app projects. Declares
  the platform matrix the app targets, the app version, the Flutter
  config block, SDK environment constraints, and project-wide pub
  dependencies. Modules restrict themselves to a subset of the platform
  matrix via their top-level `platforms` array; reduction verifies every
  module entry names a platform declared here.
type: object
additionalProperties: false
required: [platforms]
properties:
  platforms:
    description: >
      The platforms this app targets — the project's platform matrix.
      Modules omitting their own `platforms` field support all of these;
      modules declaring one must stay within this set.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/PlatformName" }
    uniqueItems: true
    minItems: 1
  project_decisions:
    description: >
      Decision ids that shape the project as a whole (platform matrix
      rationale, state-management approach, navigation architecture).
      Distinct from module-scope `guided_by`: project_decisions describes
      commitments that span the architecture itself rather than any one
      module's implementation. Validated by graph check
      `architecture_project_decisions_resolves`.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/DecisionId" }
    uniqueItems: true
