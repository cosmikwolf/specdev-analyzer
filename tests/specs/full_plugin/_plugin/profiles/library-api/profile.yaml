# Manifest — drives analyzer dispatch for library-api projects.
# Schema: specdev-analyzer/src/embedded/profile.schema.yaml.
# Inlined to project at specs/specdev/profile.yaml during bootstrap.

name: library-api
language: rust

cargo_toml:
  shape: library
  default_edition: "2021"
  lib: {}                         # default `[lib]` (rlib); no crate_type override
  features:
    synthesize_default: true
    drain_from: ["features"]      # architecture.toml's [[features]]
  architecture_deps:
    typed_slots: []
    open_arrays: ["external_deps"]

reverse:
  # #102: a pure-Rust crate inlines no block; its reverse vocabulary is
  # the profile's own schema (items, visibility, feature gates). The
  # pre-flight reads this and reports REVERSE-002 as info, not an error.
  vocabulary: profile

bootstrap:
  steps: []                       # standalone library; no workspace machinery

context:
  module_fields_for_prompt:
    [items, satisfies, depends_on, context_files, external_deps]
  context_subcommand_extras:
    - field: visibility
      from_attr: visibility

surface:
  has_modules: true
  has_requirements: true
  has_architecture: true
