# Manifest — drives analyzer dispatch for nextjs-app projects.
# Schema: specdev-analyzer/src/embedded/profile.schema.yaml.
# Inlined to project at specs/specdev/profile.yaml during bootstrap.

# Contract this manifest is authored against; compared to the
# analyzer's PROFILE_CONTRACT_VERSION before the schema runs (#117).
contract_version: 2

name: nextjs-app
language: typescript

# Config files written once when absent by `specdev-analyzer manifest
# --write`, then externally owned: never rewritten, never gen-recorded.
# `next build` rewrites tsconfig.json on its first run when Next's keys
# are missing; the template is authored in the post-build shape so the
# file stays byte-identical. A deleted config comes back on the next
# write — that is the "written when absent" rule, not a bug.
paired_files:
  - { template_file: templates/tsconfig.json.template,        target: tsconfig.json }
  - { template_file: templates/next.config.ts.template,       target: next.config.ts }
  - { template_file: templates/vitest.config.ts.template,     target: vitest.config.ts }
  - { template_file: templates/playwright.config.ts.template, target: playwright.config.ts }
  - { template_file: templates/gitignore.template,            target: .gitignore }
  - { template_file: templates/gitkeep.template,              target: app/.gitkeep }
  # pnpm 10 blocks a dependency's install scripts by default and still
  # exits 0, so a native binary silently never builds. The allowlist has
  # to live here: package.json is gen output and `manifest --write`
  # overwrites it.
  - { template_file: templates/pnpm-workspace.yaml.template,  target: pnpm-workspace.yaml }

# Compile gates, as data: the gate script (and CI) runs each `steps` argv
# in order in the project root. `fast` is the
# quick gate: install without
# `--frozen-lockfile` on purpose (a new dependency must be able to move
# the lockfile), then route types, then the type check, then the unit
# tests (`--passWithNoTests`: an app with no test items yet is not a
# failure). `next-build` is the whole-tree gate: it is the only check that catches a client-component rule
# violation in a route file (`typegen` and `tsc` are blind to it) and
# it prerenders every static route.
gates:
  - label: fast
    steps:
      - [pnpm, install]
      - [pnpm, exec, next, typegen]
      - [pnpm, exec, tsc, --noEmit]
      - [pnpm, exec, vitest, run, --passWithNoTests]
  - label: next-build
    steps:
      - [pnpm, exec, next, build]

bootstrap:
  steps: []                       # standalone app; no workspace machinery

context:
  context_subcommand_extras:
    - field: role
      from_attr: role

reverse:
  vocabulary: profile             # the profile's own schema is the reverse vocabulary

surface:
  has_modules: true
  has_requirements: true
  has_architecture: true
