$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/nextjs-app/architecture.schema.yaml"
title: "nextjs-app architecture spec (v1)"
description: >
  Shape of `specs/architecture.toml` for nextjs-app projects. Declares
  the app version, the Node and package-manager pins, the package.json
  scripts overrides, and project-wide npm dependencies. Every field is
  optional; an empty file validates. `specdev-analyzer manifest --write`
  reads this file to emit package.json.
type: object
additionalProperties: false
properties:
  project_decisions:
    description: >
      Decision ids that shape the project as a whole (rendering
      strategy, data-access layer, authentication approach). Distinct
      from module-scope `guided_by`: project_decisions describes
      commitments that span the architecture itself rather than any one
      module's implementation. Validated by graph check
      `architecture_project_decisions_resolves`.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/DecisionId" }
    uniqueItems: true
