# Manifest — drives analyzer dispatch for rust-workspace shells.
# Schema: specdev-analyzer/src/embedded/profile.schema.yaml.
# Inlined to project at specs/specdev/profile.yaml during bootstrap.
#
# `shape: workspace` is descriptive metadata. The actual cargo-toml dispatch
# fires off `[workspace]` table presence in spec.toml (layout-driven dispatch
# carve-out). The PROFILE-LAYOUT-MISMATCH validate check ensures the two
# signals agree.

# Contract this manifest is authored against; compared to the
# analyzer's PROFILE_CONTRACT_VERSION before the schema runs (#117).
contract_version: 2

name: rust-workspace
language: rust

# Compile gate, as data: the gate script (and CI) runs each `steps` argv
# in order in the project root; the first non-zero exit fails the gate.
# Warnings do not fail the gate; `cargo check` errors do.
gates:
  - label: cargo-check
    steps:
      - [cargo, check, --quiet]

bootstrap:
  steps: [emit_workspace_root, emit_member_stubs, walk_members]

context:
  context_subcommand_extras: []

surface:
  has_modules: false              # F-009 hook
  has_requirements: false
  has_architecture: true
