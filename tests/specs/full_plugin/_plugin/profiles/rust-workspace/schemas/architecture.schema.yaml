$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/rust-workspace/architecture.schema.yaml"
title: "rust-workspace architecture spec (v1)"
description: >
  Shape of `specs/architecture.toml` for a Cargo workspace. Declares
  the canonical [workspace.package] fields (members inherit via
  `*.workspace = true`) and hoisted [[workspace_dependencies]]
  candidates (members opt in via `source = "workspace"`).

  Bidirectional-minimality enforcement: this schema MUST NOT carry any
  per-member fields (modules, requirements, per-crate features).
  Per-member surface lives in each member's own `specs/` tree.

type: object
additionalProperties: false
properties:
  project_decisions:
    description: >
      Decision ids that shape the workspace as a whole (member layout,
      hoisted dependency policy, MSRV policy, release strategy).
      Workspace-tier decisions implicitly apply to every module in
      every member crate — child crates do not name workspace
      decisions in their own `decided_by` / `guided_by`, keeping each
      member crate self-contained. Validated by graph check
      `architecture_project_decisions_resolves`.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/RequirementId" }
    uniqueItems: true
