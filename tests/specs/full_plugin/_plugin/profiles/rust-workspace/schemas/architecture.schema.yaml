$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/rust-workspace/architecture.schema.yaml"
title: "rust-workspace architecture spec (v1)"
description: >
  Shape of `specs/architecture.toml` for a Cargo workspace. Declares
  the canonical [workspace.package] fields (members inherit via
  `*.workspace = true`) and hoisted [[workspace_dependencies]]
  candidates (members opt in via `source = "workspace"`).

  Bidirectional-minimality enforcement: this schema MUST NOT carry any
  per-member fields (modules, requirements, per-crate features).
  Per-member surface lives in each member's own `specs/` tree.

type: object
additionalProperties: false
properties:
  workspace_package:
    description: |
      Workspace-level [package] fields inherited by members. Each field
      set here causes the member-mode cargo-toml emitter to render
      `<field>.workspace = true` instead of a literal copy. Per G-005,
      the inheritable fields are: version, edition, rust-version,
      license, repository. `name` and `description` are NOT inheritable
      (always per-crate).
    type: object
    additionalProperties: false
    properties:
      version:
        type: string
        minLength: 1
      edition:
        type: string
        enum: ["2018", "2021", "2024"]
      rust-version:
        type: string
        minLength: 1
      license:
        type: string
        minLength: 1
      repository:
        type: string
        minLength: 1
  workspace_dependencies:
    description: |
      Hoisted dependency candidates. Members reference these by setting
      `source = "workspace"` on a CrateReference; the member's
      Cargo.toml then emits `<dep> = { workspace = true, ... }`.
    type: array
    items:
      $ref: "https://specdev.dev/schema/meta/v1/crate_reference.schema.yaml#/$defs/CrateReference"
  project_decisions:
    description: >
      Decision ids that shape the workspace as a whole (member layout,
      hoisted dependency policy, MSRV policy, release strategy).
      Workspace-tier decisions implicitly apply to every module in
      every member crate — child crates do not name workspace
      decisions in their own `decided_by` / `guided_by`, keeping each
      member crate self-contained. Validated by graph check
      `architecture_project_decisions_resolves`.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/RequirementId" }
    uniqueItems: true
