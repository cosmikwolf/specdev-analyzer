$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/rust-workspace/workspace.schema.yaml"
title: "rust-workspace workspace spec (v1)"
description: >
  Schema for the `[workspace]` table on a `rust-workspace` project's
  `spec.toml`. Member list shape; presence of this table at the root is
  the workspace marker. D36 enforcement: this schema rejects any
  per-member internals (`additionalProperties: false`).

type: object
additionalProperties: false
required: [members]
properties:
  resolver:
    description: |
      Cargo resolver version. Emitted as `[workspace] resolver = "..."`.
      Defaults to "2" at emit time when absent.
    type: string
    enum: ["1", "2", "3"]
  members:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          description: Member crate name. Must match the member's `[project].name`.
          type: string
          pattern: "^[a-z][a-z0-9_-]*$"
          maxLength: 64
        path:
          description: Path to the member crate, relative to this spec.toml.
          type: string
          minLength: 1
