$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/ts-library/architecture.schema.yaml"
title: "ts-library architecture spec (v1)"
description: >
  Shape of `specs/architecture.toml` for ts-library projects. Holds the
  project-wide decisions list only; dependencies and the `exports` map
  live in `package.json`, their only source of truth.
type: object
additionalProperties: false
properties:
  project_decisions:
    description: >
      Decision ids that shape the project as a whole (module format,
      supported Node versions, public API conventions). Distinct from
      module-scope `guided_by`: project_decisions describes commitments
      that span the architecture itself rather than any one module's
      implementation. Validated by graph check
      `architecture_project_decisions_resolves`.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/RequirementId" }
    uniqueItems: true
