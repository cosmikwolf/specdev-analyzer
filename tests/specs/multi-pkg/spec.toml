# Minimal 2-package firmware project for analyzer tests.
spec_version = "1.0"

[project]
name = "multi-pkg"
domain = "firmware"
language = "rust"

[source]
root = "src"
layout = "workspace"

[paths.overrides]

[[packages]]
name = "core"
source_path = "crates/core"

[[packages]]
name = "drivers"
source_path = "crates/drivers"
