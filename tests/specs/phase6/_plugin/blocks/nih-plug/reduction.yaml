metaschema_version: "v1"

# nih-plug block reduction. Three entity kinds — Parameter, AudioPort,
# MidiConfig — all extending Module since they're declarative
# sub-units of a plugin shell module. ProcessConfig is intentionally
# NOT materialized as an entity in v1: it carries no name (singleton
# attributes only) and no graph check needs to reach into it; codegen
# prose reads it directly from the module's TOML.
#
# Qualified entity names combine parent module name with the local
# name (e.g. "MyPlugin.gain" for module=MyPlugin, parameter=gain).
# This keeps namespaces clean across multi-module specs (rare in v1
# but unblocked for future multi-shell scenarios).
#
# v1 declares no relations. The Phase 15-E `egui+nih-plug` bridge
# adds the `widget_binds_parameter` relation by reaching from Region
# (egui block entity) to Parameter (this block's entity).

entities:
  - kind: Parameter
    extends: Module
    from: "specs/modules/*.toml"
    for_each: "nih_plug.parameters[]"
    name: "${parent.name}.${.id}"
    attrs:
      id:   ".id"
      kind: ".kind"

  - kind: AudioPort
    extends: Module
    from: "specs/modules/*.toml"
    for_each: "nih_plug.audio_ports[]"
    name: "${parent.name}.${.name}"
    attrs:
      direction:     ".direction"
      channel_count: ".channel_count"
      kind:          ".kind"

  - kind: MidiConfig
    extends: Module
    from: "specs/modules/*.toml"
    for_each: "nih_plug.midi"
    name: "${parent.name}.midi"
    attrs:
      input:       ".input"
      output:      ".output"
      note_events: ".note_events"
      cc_events:   ".cc_events"

relations: []
