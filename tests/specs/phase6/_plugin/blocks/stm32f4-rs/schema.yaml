$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/blocks/stm32f4-rs.v1"
title: "stm32f4-rs block (v1)"
description: >
  Schema fragment contributed by the `stm32f4-rs` block. Adds a
  namespaced `[stm32f4]` table to `Module` carrying STM32F4 MCU concerns:
  peripherals (USART/SPI/I2C/GPIO/TIM/etc., by HAL kind + instance) and
  pins (GPIO port + pin + alternate-function mapping).

  v1 covers peripherals + pins. Clock-tree configuration (HSE/HSI/PLL),
  DMA stream wiring, and interrupt-priority assignment are deferred —
  either to a future `stm32f4-clocks` block, project-level architecture
  (specs/architecture.toml), or the embassy+stm32f4-rs bridge.

  This block targets `stm32f4xx-hal` / `stm32f4xx-pac`. The
  embassy-flavored `embassy-stm32` HAL is OUT OF SCOPE (would violate
  doc 15 §3.1 leg 3, no cross-block reach); embassy integration goes
  through the `embassy+stm32f4-rs` bridge.
type: object
properties:
  stm32f4:
    type: object
    additionalProperties: false
    properties:
      peripherals:
        description: >
          Peripheral instances the module owns. Each becomes a typed
          handle from stm32f4xx-hal at codegen time.
        type: array
        items: { $ref: "#/$defs/Peripheral" }
      pins:
        description: >
          GPIO pin bindings the module owns. Each becomes a typed pin
          handle (e.g. `gpioa.pa9.into_alternate::<7>()`) at codegen time.
        type: array
        items: { $ref: "#/$defs/Pin" }

$defs:
  Identifier:
    description: snake_case or PascalCase identifier usable as a Rust ident.
    type: string
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"

  Peripheral:
    type: object
    additionalProperties: false
    required: [name, kind, instance]
    properties:
      name:
        $ref: "#/$defs/Identifier"
      kind:
        description: >
          Peripheral category. Closed enum — STM32F4 has a finite set of
          peripheral families. Restrict to known ones so typos surface
          as schema errors.
        type: string
        enum: [USART, SPI, I2C, GPIO, TIM, ADC, DMA, RCC]
      instance:
        description: >
          Numeric instance (e.g. `instance = 1` for USART1). Some
          peripherals exist in multiple copies on a single MCU; this
          field disambiguates.
        type: integer
        minimum: 1

  Pin:
    type: object
    additionalProperties: false
    required: [name, port, pin]
    properties:
      name:
        $ref: "#/$defs/Identifier"
      port:
        description: GPIO port. STM32F4 ports are A through H.
        type: string
        enum: [A, B, C, D, E, F, G, H]
      pin:
        description: Pin number within the port (0..15).
        type: integer
        minimum: 0
        maximum: 15
      alt_fn:
        description: >
          Alternate-function number when `mode = "alternate"`. Each
          pin's alternate functions are MCU-specific; consult the
          datasheet's alternate-function mapping table.
        type: integer
        minimum: 0
        maximum: 15
      mode:
        description: >
          Pin operating mode. `alternate` for peripheral routing
          (USART_TX, SPI_SCK, etc.); `input`/`output` for general-
          purpose digital I/O; `analog` for ADC inputs.
        type: string
        enum: [input, output, alternate, analog]
        default: alternate
