# Manifest — Cargo deps the stm32h5-rs block contributes.
# Schema: specdev-analyzer/src/embedded/block_deps.schema.yaml.
#
# This block contributes NO crates today. The non-embassy STM32H5 HAL
# (`stm32h5xx-hal`) has no usable crates.io release yet (0.0.0
# placeholder); the codegen prose's stm32h5xx-hal emission patterns are
# forward-looking and activate when that crate ships. Until then, the
# only production-quality H5 HAL is `embassy-stm32` — a join-product
# crate owned by the `embassy+stm32h5-rs` bridge (see that bridge's
# codegen/rust/deps.yaml), never by this block: declaring it here would
# couple the block to one async runtime and break composition with
# non-embassy projects.

crates: []

recommended_external_deps:
  - crate: cortex-m
    purpose: "ARM Cortex-M startup primitives"
  - crate: cortex-m-rt
    purpose: "linker glue + reset handler"
