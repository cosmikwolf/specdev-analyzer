# Manifest — drives analyzer dispatch for audio-plugin projects.
# Schema: specdev-analyzer/src/embedded/profile.schema.yaml.
# Inlined to project at specs/specdev/profile.yaml during bootstrap.

name: audio-plugin
language: rust

cargo_toml:
  shape: plugin
  default_edition: "2021"
  lib:
    crate_type: ["cdylib"]
    cdylib_only: true
  bin:
    name_template: "{project_name}-standalone"
    path_template: "src/bin/standalone.rs"
    gate:
      kind: architecture_array_contains
      table: "plugin"
      field: "formats"
      value: "standalone"
    paired_stub:
      template_file: templates/standalone-stub.rs.template
  features:
    synthesize_default: true
    drain_from: ["features"]
  architecture_deps:
    typed_slots: []
    open_arrays: ["external_deps"]

bootstrap:
  steps: []                       # standalone plugin; no workspace machinery

skeleton:
  supported: true                 # silence-and-log policy: see codegen prose
  entry_file: src/lib.rs
  entry_template: empty
  extra_files: []
  module_layout: flat
  steps: [emit_cargo_toml, walk_modules, emit_handoff_md]
  audio_path_stub: silence_and_log
  # Audio-thread methods emit a silence-and-log body; non-audio-path
  # items retain `unimplemented!()`. Classification is two-pronged:
  # codegen prose carries the hardcoded nih-plug `Plugin` trait method
  # list, and items[] entries opt in via `is_audio_path = true` for
  # hand-authored DSP-node helpers the trait list does not reach. See
  # `codegen/rust/module.conventions.md` § "Skeleton mode (silence-and-log)".

context:
  module_fields_for_prompt:
    [items, satisfies, depends_on, context_files, external_deps, layer,
     nih_plug, egui]
  context_subcommand_extras:
    - field: layer
      from_attr: layer

surface:
  has_modules: true
  has_requirements: true
  has_architecture: true
