$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/audio-plugin/architecture.schema.yaml"
title: "audio-plugin architecture spec (v1)"
description: |
  Shape of `specs/architecture.toml` for an audio-plugin project. Three
  required tables (per Phase 15-A spike §1.2):

    [plugin]   — vendor / display / format identity. Drives
                 `nih_export_*!` macro selection (D45) and per-format
                 constant emission (D46).
    [audio]    — main bus channel layout, sample-rate bounds, latency,
                 optional aux input/output sidechains.
    [runtime]  — panic handler enum, realtime_audit informational flag.

  Optional `[[features]]` declares Cargo features (parity with
  library-api); modules may reference these via `feature_gates[]`. The
  `module_feature_gates_resolve` graph check verifies references resolve.

  Validation here is structural; codegen-time soft checks (e.g. format
  / category coherence) live in the codegen prose, not in this schema.
type: object
additionalProperties: false
required: [plugin, audio, runtime]
properties:
  plugin:
    description: |
      Plugin vendor + identity + distribution. All five required
      fields are surfaced to hosts in plugin metadata panels.
    type: object
    additionalProperties: false
    required: [name, vendor, version, category, formats]
    properties:
      name:
        description: |
          Display name shown by the host. Need not match the crate
          name. UTF-8 free string; max length unset in v1 (some hosts
          truncate at ~32 chars — author at your own risk).
        type: string
        minLength: 1
        maxLength: 200
      vendor:
        description: |
          Vendor / company display name shown by the host.
        type: string
        minLength: 1
        maxLength: 200
      url:
        description: |
          Optional vendor / product URL. Some hosts expose this as a
          clickable link.
        type: string
        format: uri
      email:
        description: |
          Optional vendor support email. nih-plug surfaces this in the
          generated VST3 / CLAP factory metadata.
        $ref: "enums.schema.yaml#/$defs/EmailAddress"
      version:
        description: |
          Plugin display version (strict three-part numeric SemVer).
          Drives the VST3 / CLAP version fields. Independent of the
          crate's Cargo.toml `[package].version`.
        $ref: "enums.schema.yaml#/$defs/PluginVersion"
      category:
        description: |
          Closed enum (D46): instrument | fx | midi-fx | analyzer.
          Codegen prose maps this to per-format constants
          (`VST3_CATEGORIES` string, `CLAP_FEATURES` slice). Free-string
          would be VST3-shaped only; per-format separate fields would
          force authors to repeat the same intent four ways.
        $ref: "enums.schema.yaml#/$defs/PluginCategory"
      formats:
        description: |
          Distribution formats this plugin supports. At least one. Drives
          which `nih_export_*!` macros emit and which crate-type targets
          the plugin Cargo.toml declares (D45):
            "vst3"        → cdylib lib target + nih_export_vst3!
            "clap"        → cdylib lib target + nih_export_clap!
            "standalone"  → adds `[[bin]]` standalone target +
                            nih_export_standalone! in src/bin/standalone.rs
          AU is out of scope for v1 (separate API surface in nih-plug).
        type: array
        items: { $ref: "enums.schema.yaml#/$defs/PluginFormat" }
        minItems: 1
        uniqueItems: true

  audio:
    description: |
      Main audio bus configuration + optional aux buses. Declared at
      architecture level because format/host negotiation happens at
      plugin-shell time, not per module.
    type: object
    additionalProperties: false
    required: [default_channel_layout]
    properties:
      default_channel_layout:
        description: |
          Default channel layout for the main I/O bus. Hosts may
          renegotiate at instantiation time; this is the plugin's
          declared preference.
        $ref: "enums.schema.yaml#/$defs/ChannelLayout"
      min_sample_rate:
        description: |
          Minimum sample rate (Hz) the plugin supports. Optional; if
          unset, the plugin accepts whatever the host offers. Common
          values: 22050, 32000, 44100, 48000.
        type: integer
        minimum: 1
      max_sample_rate:
        description: |
          Maximum sample rate (Hz). Common values: 96000, 192000,
          384000. Optional.
        type: integer
        minimum: 1
      latency_samples:
        description: |
          Plugin-declared latency in samples. Hosts use this to
          compensate plugin delay across the project. Default is 0
          (no declared latency); set this when the DSP path introduces
          a fixed sample-aligned delay (FFT lookahead, oversampling
          group delay).
        type: integer
        minimum: 0
        default: 0
      aux_inputs:
        description: |
          Optional auxiliary input buses (sidechains, key inputs).
          Hosts route additional signals to these. nih-plug accepts
          arbitrary channel counts per aux bus.
        type: array
        items: { $ref: "#/$defs/AuxBus" }
      aux_outputs:
        description: |
          Optional auxiliary output buses (sends, multi-out).
        type: array
        items: { $ref: "#/$defs/AuxBus" }

  runtime:
    description: |
      Runtime infrastructure picks. `panic_handler` is required; cdylib
      builds for VST3 require `abort` (the host catches the abort and
      unloads the plugin). `unwind` is permitted for standalone-only
      builds.
    type: object
    additionalProperties: false
    required: [panic_handler]
    properties:
      panic_handler:
        description: |
          Closed enum (`abort` | `unwind`). VST3 requires `abort`
          because the host's stack must not see Rust unwinding through
          a C ABI boundary. Standalone-only builds may use `unwind`.
        $ref: "enums.schema.yaml#/$defs/PanicHandlerKind"
      realtime_audit:
        description: |
          Informational flag. When `true`, the project is opting in to
          realtime-audit conventions (no alloc / no lock / no log on
          the audio path). v1 carries this as a marker only; a future
          `realtime_path_no_alloc` graph-check primitive (D48 bounded
          follow-up) consumes it. v1 codegen prose enforces the
          discipline; tooling enforcement is gated on 15-G dogfood
          evidence.
        type: boolean
        default: false

  features:
    description: |
      Cargo features the plugin crate exposes. Each entry declares one
      feature; modules reference these via `feature_gates[]`. Same
      shape as library-api's `[[features]]`. Plugins typically use
      this for optional MIDI handling, SIMD vs scalar DSP, or
      debug-only RTT logging.
    type: array
    items: { $ref: "#/$defs/Feature" }

  external_deps:
    description: |
      Open list for project-author crate additions beyond the typed
      slots above. Every entry lands in Cargo.toml `[dependencies]`.
      Use this for crates that don't fit a typed role (e.g.,
      `crossbeam-channel`, `parking_lot`).
    type: array
    items:
      $ref: "https://specdev.dev/schema/meta/v1/crate_reference.schema.yaml#/$defs/CrateReference"

$defs:
  AuxBus:
    type: object
    additionalProperties: false
    required: [name, channel_count]
    properties:
      name:
        $ref: "enums.schema.yaml#/$defs/Identifier"
      channel_count:
        type: integer
        minimum: 1
        maximum: 32

  Feature:
    description: |
      One Cargo feature entry. Mirrors library-api's Feature shape so
      authors moving between profiles see the same vocabulary.
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        $ref: "enums.schema.yaml#/$defs/FeatureName"
      description:
        type: string
      depends_on:
        description: >
          Other features that must be enabled for this feature to be
          meaningful. The `feature_dependencies_resolve` graph check
          verifies every entry names a declared feature.
        type: array
        items: { $ref: "enums.schema.yaml#/$defs/FeatureName" }
        uniqueItems: true
      cargo_deps:
        description: >
          Cargo's open-form feature dep strings — accepts `dep:<crate>`,
          `<crate>/<feature>`, and `<crate>?/<feature>`. Emitted into
          the generated Cargo.toml `[features]` table verbatim, after
          the `depends_on` entries.
        type: array
        items:
          type: string
          pattern: "^(dep:[a-z0-9_-]+|[a-z0-9_-]+\\??/[a-z0-9_-]+)$"
        uniqueItems: true
      default:
        description: >
          When `true`, this feature is in the crate's
          `[features] default = [...]` set. Defaults to `false`.
        type: boolean
        default: false
