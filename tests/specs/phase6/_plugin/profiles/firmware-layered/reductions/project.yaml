metaschema_version: "v1"

# Project-level entity declarations: the kinds that exist at the profile
# root, before any block or bridge contributes its own kinds. Inlined
# blocks declare their own kinds via reductions/blocks/.

entities:
  # Modules — the core unit. Each `specs/modules/*.toml` produces one Module.
  - kind: Module
    extends: structural
    from: "specs/modules/*.toml"
    name: "${.name}"
    attrs:
      layer: ".layer"

  # Ports declared inside each module — used as the targets of architecture connections.
  - kind: Port
    extends: Module
    from: "specs/modules/*.toml"
    for_each: "ports[]"
    # Qualified port name (e.g. "AudioSource.out") matches the architecture
    # connection endpoints. The reduction concatenates parent module name
    # with the port's local name.
    name: "${parent.name}.${.name}"
    attrs:
      direction: ".direction"
      port_type: ".port_type"

  # Connections from `specs/architecture.toml`. The connection's name is
  # synthesized from its endpoints so each is structurally unique.
  - kind: Connection
    extends: structural
    from: "specs/architecture.toml"
    for_each: "connections[]"
    name: "${.from}->${.to}"
    attrs:
      from: ".from"
      to: ".to"
      flow_type: ".flow_type"

  # Source documents from `specs/requirements.toml`.
  - kind: Source
    extends: structural
    from: "specs/requirements.toml"
    for_each: "source[]"
    name: "${.id}"
    attrs:
      kind: ".kind"
      title: ".title"

  # Individual requirements.
  - kind: Requirement
    extends: structural
    from: "specs/requirements.toml"
    for_each: "requirement[]"
    name: "${.id}"
    attrs:
      text: ".text"
      nature: ".nature"

  # Architecture singleton — one per project. Materializes the
  # `architecture.toml` file as a graph node so top-level relations
  # (project_decisions, future architecture-anchored references) have
  # a source endpoint to attach to.
  - kind: Architecture
    extends: structural
    from: "specs/architecture.toml"
    name: "architecture"

  # Decisions — the *how & why*. Codegen prompt walk follows only
  # `accepted` entries; `superseded` entries persist as reasoning trail.
  - kind: Decision
    extends: structural
    from: "specs/decisions.toml"
    for_each: "decision[]"
    name: "${.id}"
    attrs:
      title: ".title"
      status: ".status"
      text: ".text"

  # Open questions — the *known unknowns*. Three statuses
  # (open / default_committed / closed) shape the codegen-gate behavior.
  - kind: OpenQuestion
    extends: structural
    from: "specs/open_questions.toml"
    for_each: "open_question[]"
    name: "${.id}"
    attrs:
      title: ".title"
      status: ".status"
      text: ".text"

relations:
  # Module-to-module dependency edges (drives modules_acyclic + layer_dependency).
  - kind: depends_on
    extends: depends_on
    from_kind: Module
    to_kind: Module
    from_spec: "specs/modules/*.toml"
    for_each: "depends_on[]"
    endpoints:
      from: "${parent.name}"
      to: "${.}"

  # Requirement-to-parent traceability (drives requirement_satisfies_resolves).
  - kind: satisfies
    extends: depends_on
    from_kind: Requirement
    to_kind: Requirement
    from_spec: "specs/requirements.toml"
    for_each: "requirement[].satisfies[]"
    endpoints:
      from: "${parent.id}"
      to: "${.}"

  # Module-to-requirement (drives module_satisfies_resolves). Distinct
  # relation kind from the requirement-tree `satisfies` so graph checks
  # can target each independently.
  - kind: module_satisfies
    extends: depends_on
    from_kind: Module
    to_kind: Requirement
    from_spec: "specs/modules/*.toml"
    for_each: "satisfies[]"
    endpoints:
      from: "${parent.name}"
      to: "${.}"

  # Requirement → Decision: pin a requirement's *how*. Drives
  # `requirement_decided_by_resolves`.
  - kind: requirement_decided_by_decision
    extends: depends_on
    from_kind: Requirement
    to_kind: Decision
    from_spec: "specs/requirements.toml"
    for_each: "requirement[].decided_by[]"
    endpoints:
      from: "${parent.id}"
      to: "${.}"

  # Module → Decision: inform a module without pinning a requirement.
  # Drives `module_guided_by_resolves`.
  - kind: module_guided_by_decision
    extends: depends_on
    from_kind: Module
    to_kind: Decision
    from_spec: "specs/modules/*.toml"
    for_each: "guided_by[]"
    endpoints:
      from: "${parent.name}"
      to: "${.}"

  # Architecture → Decision: project-shape commitments. Drives
  # `architecture_project_decisions_resolves`.
  - kind: architecture_project_decision
    extends: depends_on
    from_kind: Architecture
    to_kind: Decision
    from_spec: "specs/architecture.toml"
    for_each: "project_decisions[]"
    endpoints:
      from: "architecture"
      to: "${.}"

  # Decision → Decision: supersession chain via `supersedes[]` on
  # accepted decisions.
  - kind: decision_supersedes_decision
    extends: depends_on
    from_kind: Decision
    to_kind: Decision
    from_spec: "specs/decisions.toml"
    for_each: "decision[].supersedes[]"
    endpoints:
      from: "${parent.id}"
      to: "${.}"

  # Decision → OpenQuestion: closure references. Drives
  # `decision_closes_questions_resolve`.
  - kind: decision_closes_open_question
    extends: depends_on
    from_kind: Decision
    to_kind: OpenQuestion
    from_spec: "specs/decisions.toml"
    for_each: "decision[].closes_questions[]"
    endpoints:
      from: "${parent.id}"
      to: "${.}"

  # Decision → OpenQuestion: default-commit references. Drives
  # `decision_defaults_for_resolve`.
  - kind: decision_defaults_open_question
    extends: depends_on
    from_kind: Decision
    to_kind: OpenQuestion
    from_spec: "specs/decisions.toml"
    for_each: "decision[].defaults_for[]"
    endpoints:
      from: "${parent.id}"
      to: "${.}"

  # OpenQuestion → Requirement: which requirements this question
  # affects. Drives `open_question_affects_resolve`.
  - kind: open_question_affects_requirement
    extends: depends_on
    from_kind: OpenQuestion
    to_kind: Requirement
    from_spec: "specs/open_questions.toml"
    for_each: "open_question[].affects[]"
    endpoints:
      from: "${parent.id}"
      to: "${.}"

  # OpenQuestion → Decision: which decision committed the working
  # default. Drives `open_question_default_via_resolves`.
  - kind: open_question_default_via_decision
    extends: depends_on
    from_kind: OpenQuestion
    to_kind: Decision
    from_spec: "specs/open_questions.toml"
    for_each: "open_question[]"
    endpoints:
      from: "${.id}"
      to: "${.default_via}"
