$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://specdev.dev/profiles/library-api/module.schema.yaml"
title: "library-api module spec (v1)"
description: >
  Shape of a single module spec in `specs/modules/*.toml`. One module
  per file; filename should match the `name` field. library-api targets
  Rust libraries where the load-bearing concerns are public-API surface,
  re-exports, and feature flags. Modules carry visibility (pub / crate /
  private), and may declare re-exports of other modules and feature
  gates that conditionally include them.
type: object
# `unevaluatedProperties: false` rather than `additionalProperties: false`
# because JSON Schema 2020-12's additionalProperties is NOT `allOf`-aware
# — it would reject keys contributed by inlined block schemas even when
# those are valid via the aggregator `allOf:` slot. unevaluatedProperties
# IS allOf-aware.
unevaluatedProperties: false
required: [name, visibility]
properties:
  name:
    $ref: "enums.schema.yaml#/$defs/Identifier"
  visibility:
    $ref: "enums.schema.yaml#/$defs/Visibility"
  description:
    type: string
  depends_on:
    description: >
      Other modules within this library this module depends on. The
      `modules_acyclic` graph check enforces no cycles.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/ModuleRef" }
    uniqueItems: true
  satisfies:
    description: >
      Requirement ids this module satisfies. The
      `module_satisfies_resolves` graph check verifies each id exists.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/RequirementId" }
    uniqueItems: true
  external_deps:
    description: |
      External crate dependencies this module needs (Phase 6.7+). Each
      entry becomes a Cargo.toml `[dependencies]` line; the union
      across all modules in the library determines the full dep set
      Phase 8's `gen` emits. Use this for crates that aren't gated by
      a Cargo feature; feature-gated optional deps are still expressed
      via `feature_gates` + the architecture's `[[features]]` table.
    type: array
    items:
      $ref: "https://specdev.dev/schema/meta/v1/crate_reference.schema.yaml#/$defs/CrateReference"
  feature_gates:
    description: >
      Cargo features that conditionally include this module. The module
      compiles only when at least one of the listed features is active
      (treated as `#[cfg(any(feature = "f1", feature = "f2"))]`). An
      empty list (or omitted field) means the module is unconditional.
      `module_feature_gates_resolve` verifies every name is declared in
      `architecture.toml`.
    type: array
    items: { $ref: "enums.schema.yaml#/$defs/FeatureName" }
    uniqueItems: true
  bindings:
    description: >
      Aggregator slot for bridge contributions (Phase 7+). Open in v1.
    type: object
    additionalProperties: true
  items:
    description: >
      Top-level Rust constructs that carry spec significance — items[]
      entry per `pub` function, struct, enum, trait, impl, type, const,
      static, re-export, or macro contributing to the module's
      contractual surface. Sparseness rule (enforced by the language
      schema): every item except `kind = "re_export"` must carry
      `satisfies` (≥1 requirement id). Phase 14 introduces this field;
      consumed by Phase 13's skeleton mode emitter and by Phase 14's
      three-stage agentic sync (`items diff` / `items propose` /
      `items apply`).
    type: array
    items:
      $ref: "inlined/languages/{{language}}/items.schema.yaml"
    uniqueItems: true
